sglang_version: 0.5.19
image: lmsysorg/sglang:v0.5.19-cu129
flags:
  abort-on-priority-when-disabled:
    kind: flag
    help: If set, abort requests that specify a priority when priority scheduling is disabled.
  admin-api-key:
    kind: value
    type: str
    help: Set admin API key for sensitive management endpoints (e.g. /clear_hicache_storage_backend).
      When set, admin endpoints require this key and do NOT accept --api-key.
  allow-auto-truncate:
    kind: flag
    help: Allow automatically truncating requests that exceed the maximum input length instead of returning
      an error.
  allowed-media-domains:
    kind: value
    nargs: +
    type: str
    default: []
    help: Restrict client-supplied HTTP(S) image, video, and audio URLs to these exact hostnames. Redirect
      destinations are checked against the same allowlist. When unset, remote media from any domain is
      allowed.
  api-key:
    kind: value
    type: str
    help: Set API key of the server. It is also used in the OpenAI API compatible server.
  asr-max-buffer-seconds:
    kind: value
    type: int
    default: 60
    help: Maximum seconds of PCM audio the streaming ASR WebSocket handler will accumulate before closing
      the session with a buffer_overflow error. Guards against OOM when a client streams audio faster
      than inference can consume it. Default 60s.
  asr-max-concurrent-sessions:
    kind: value
    type: int
    default: 32
    help: Maximum number of concurrent realtime ASR WebSocket sessions served by /v1/realtime. New connections
      beyond this cap are accepted, sent an error{code:too_many_sessions} frame, and closed. Default 32.
  attention-backend:
    kind: value
    type: str
    choices:
    - triton
    - torch_native
    - flex_attention
    - dsa
    - nsa
    - dsv4
    - compressed
    - cutlass_mla
    - fa3
    - fa4
    - flashinfer
    - flashmla
    - trtllm_mla
    - cutedsl_mla
    - tokenspeed_mla
    - trtllm_mha
    - dual_chunk_flash_attn
    - hpc_ops
    - minicpm_flashattn
    - minicpm_flashinfer
    - aiter
    - wave
    - intel_amx
    - ascend
    - intel_xpu
    help: Choose the kernels for attention layers.
  attn-cp-size:
    kind: value
    aliases:
    - attention-context-parallel-size
    type: int
    default: 1
    help: The attention context parallelism size.
  base-gpu-id:
    kind: value
    type: int
    default: 0
    help: The base GPU ID to start allocating GPUs from. Useful when running multiple instances on the
      same machine.
  batch-notify-size:
    kind: value
    type: int
    default: 16
    help: Number of streaming notifications to batch before yielding to the event loop. Reduces asyncio
      wakeup overhead under high concurrency.
  bf16-gemm-backend:
    kind: value
    type: str
    choices:
    - auto
    - cutedsl
    - flashinfer_pr4266
    - gemv
    - torch
    default: auto
    help: 'Choose the backend for unquantized BF16 GEMM operations. Options: ''auto'' (default; selects
      ''cutedsl'' on SM10x GPUs, except deterministic inference selects ''torch''; otherwise uses cuBLAS
      via torch.nn.functional.linear), ''cutedsl'' (SGLang JIT CuTe DSL TGV BF16 GEMM on SM10x; dispatches
      between the allowlisted low-M Split-K kernel, the CuTe DSL kernel, and cuBLAS; set SGLANG_ENABLE_BF16_SPLITK_GEMM=0
      to disable Split-K), ''flashinfer_pr4266'' (legacy compatibility alias for the optimized CuTe DSL
      path), ''gemv'', ''torch'' (always uses cuBLAS via torch.nn.functional.linear).'
  bucket-e2e-request-latency:
    kind: value
    nargs: +
    type: float
    help: The buckets of end-to-end request latency, specified as a list of floats.
  bucket-inter-token-latency:
    kind: value
    nargs: +
    type: float
    help: The buckets of inter-token latency, specified as a list of floats.
  bucket-time-to-first-token:
    kind: value
    nargs: +
    type: float
    help: The buckets of time to first token, specified as a list of floats.
  c128-page-size:
    kind: value
    type: int
    default: 16
    help: The physical page size of the NPU DSV4 C128 KV cache. Must be a positive multiple of 16.
  chat-template:
    kind: value
    type: str
    help: The buliltin chat template name or the path of the chat template file. This is only used for
      OpenAI-compatible API server.
  checkpoint-engine-wait-weights-before-ready:
    kind: flag
    help: If set, the server will wait for initial weights to be loaded via checkpoint-engine or other
      update methods before serving inference requests.
  chunked-prefill-size:
    kind: value
    type: int
    help: The maximum number of tokens in a chunk for the chunked prefill. Setting this to -1 means disabling
      chunked prefill.
  collect-tokens-histogram:
    kind: flag
    help: Deprecated. Token histograms are now automatically collected when --enable-metrics is set.
    deprecated: true
  completion-template:
    kind: value
    type: str
    help: The buliltin completion template name or the path of the completion template file. This is only
      used for OpenAI-compatible API server. only for code completion currently.
  config:
    kind: value
    type: str
    help: Read CLI options from a config file. Must be a YAML file with configuration options.
  constrained-json-disable-any-whitespace:
    kind: flag
    help: (xgrammar and llguidance backends only) Enforce compact representation in JSON constrained output.
  constrained-json-whitespace-pattern:
    kind: value
    type: str
    help: "(outlines and llguidance backends only) Regex pattern for syntactic whitespaces allowed in\
      \ JSON constrained output. For example, to allow the model generate consecutive whitespaces, set\
      \ the pattern to [\n\t ]*"
  context-length:
    kind: value
    type: human_readable_int
    help: "The model's maximum context length. Defaults to None (will use the value from the model's config.json\
      \ instead).\n\nSupports standard SI suffixes (k, M, G, T) and IEC suffixes\n    (Ki, Mi, Gi, Ti).\
      \ Suffixes are case-sensitive.\n\n    Decimals are allowed for SI suffixes only.\n\n    Examples:\n\
      \        '1k' -> 1000      '1M' -> 1000000    '25.6k' -> 25600\n        '1Ki' -> 1024     '1Mi'\
      \ -> 1048576\n    "
  cp-strategy:
    kind: value
    type: str
    choices:
    - zigzag
    - interleave
    help: Sharding strategy for prefill CP. 'zigzag' is the former in-seq-split mode; 'interleave' is
      the former round-robin-split mode.
  cpu-offload-gb:
    kind: value
    type: int
    default: 0
    help: How many GBs of RAM to reserve for CPU offloading.
  crash-dump-folder:
    kind: value
    type: str
    help: Folder path to dump requests from the last 5 min before a crash (if any). If not specified,
      crash dumping is disabled.
  cuda-graph-backend-decode:
    kind: value
    type: str
    choices:
    - full
    - breakable
    - tc_piecewise
    - disabled
    help: Backend for the decode phase. Folds into cuda_graph_config[decode].backend.
  cuda-graph-backend-prefill:
    kind: value
    type: str
    choices:
    - full
    - breakable
    - tc_piecewise
    - disabled
    help: Backend for the prefill phase. Folds into cuda_graph_config[prefill].backend.
  cuda-graph-bs:
    kind: value
    nargs: +
    type: int
    help: Deprecated alias for --cuda-graph-bs-decode.
    deprecated: true
  cuda-graph-bs-decode:
    kind: value
    nargs: +
    type: int
    help: Explicit list of batch sizes to capture for the decode cuda graph.
  cuda-graph-bs-prefill:
    kind: value
    nargs: +
    type: int
    help: Explicit list of batch sizes to capture for the prefill cuda graph.
  cuda-graph-config:
    kind: value
    type: parse_cuda_graph_config_arg
    help: 'Per-phase CUDA graph settings as JSON, e.g. ''{"decode":{"backend":"full","max_bs":256},"prefill":{"backend":"tc_piecewise","tc_compiler":"eager"}}''.
      Allowed backends per phase: full, breakable, tc_piecewise, disabled (full is decode-only). JSON
      wins over the per-phase --cuda-graph-* convenience flags and over legacy flags.'
  cuda-graph-max-bs:
    kind: value
    type: int
    help: Deprecated alias for --cuda-graph-max-bs-decode.
    deprecated: true
  cuda-graph-max-bs-decode:
    kind: value
    type: int
    help: Maximum batch size captured for the decode cuda graph.
  cuda-graph-max-bs-prefill:
    kind: value
    type: int
    help: Maximum batch size captured for the prefill cuda graph.
  cuda-graph-tc-compiler:
    kind: value
    type: str
    choices:
    - eager
    - inductor
    help: Compiler used by the tc_piecewise backend (currently only the prefill phase consumes it).
  custom-weight-loader:
    kind: value
    nargs: '*'
    type: str
    help: The custom dataloader which used to update the model. Should be set with a valid import path,
      such as my_package.weight_load_func
  dcp-comm-backend:
    kind: value
    type: str
    choices:
    - ag_rs
    - a2a
    - fi_a2a
    default: ag_rs
    help: 'Communication backend for the decode context-parallel (DCP) attention reduction: ''ag_rs''
      (AllGather + ReduceScatter), ''a2a'' (fused NCCL All-to-All exchange of output+LSE + local Triton
      LSE combine), or ''fi_a2a'' (FlashInfer MNNVL All-to-All kernel; requires SM90+ and MNNVL fabric
      memory, e.g. GB200 NVL72).'
  dcp-replicate-q-proj:
    kind: bool
    help: 'For MLA decode context parallelism with the a2a/fi_a2a backend: replicate the Q projection
      so each DCP rank computes the full-head query locally (redundant projection compute), eliminating
      the per-layer head-dim all-gather of Q. Trades a small amount of extra GEMM for one fewer collective
      per layer. Use --no-dcp-replicate-q-proj to disable the model-specific default.'
  dcp-size:
    kind: value
    aliases:
    - decode-context-parallel-size
    type: int
    default: 1
    help: The decode context parallelism size.
  debug-cuda-graph:
    kind: flag
    help: Enable debug/eager mode for CUDA graph using breakable CUDA graph. When enabled, graph breaks
      are inserted so every operation runs eagerly while still going through the CUDA graph capture /
      replay path. Useful for debugging CUDA graph capture / replay issues.
  debug-tensor-dump-input-file:
    kind: value
    type: str
    help: The input filename for dumping tensors
  debug-tensor-dump-layers:
    kind: value
    nargs: +
    type: int
    help: The layer ids to dump. Dump all layers if not specified.
  debug-tensor-dump-output-folder:
    kind: value
    type: str
    help: The output folder for dumping tensors. In Eagle mode, tensor outputs from draft and target models
      are stored in separate subdirectories ('draft' and 'target').
  decode-attention-backend:
    kind: value
    type: str
    choices:
    - triton
    - torch_native
    - flex_attention
    - dsa
    - nsa
    - dsv4
    - compressed
    - cutlass_mla
    - fa3
    - fa4
    - flashinfer
    - flashmla
    - trtllm_mla
    - cutedsl_mla
    - tokenspeed_mla
    - trtllm_mha
    - dual_chunk_flash_attn
    - hpc_ops
    - minicpm_flashattn
    - minicpm_flashinfer
    - aiter
    - wave
    - intel_amx
    - ascend
    - intel_xpu
    help: Choose the kernels for decode attention layers (have priority over --attention-backend).
  decode-log-interval:
    kind: value
    type: int
    default: 40
    help: The log and metrics reporting interval (in decode iterations) for decode batches.
  decoupled-spec-bind-endpoint:
    kind: value
    type: str
    help: 'ZMQ endpoint this engine binds for its inbound channel in decoupled speculative decoding (verifier:
      result PULL; drafter: control PULL).'
  decoupled-spec-connect-endpoints:
    kind: value
    type: json_list_type
    help: Peer inbound (bind) endpoints to connect to, ordered by peer rank, for decoupled speculative
      decoding.
  decoupled-spec-rank:
    kind: value
    type: int
    help: This engine's rank within its own role space (verifier-rank or drafter-rank) for decoupled speculative
      decoding.
  decoupled-spec-role:
    kind: value
    type: str
    choices:
    - 'null'
    - verifier
    - drafter
    default: 'null'
    help: 'Role in decoupled speculative decoding: ''null'' disables it, ''verifier'' runs the target/verify
      half, ''drafter'' runs the draft half.'
  decrypted-config-file:
    kind: value
    type: str
    help: The path of the decrypted config file.
  decrypted-draft-config-file:
    kind: value
    type: str
    help: The path of the decrypted draft config file.
  deepep-config:
    kind: value
    type: str
    help: Tuned DeepEP config suitable for your own cluster. It can be either a string with JSON content
      or a file path.
  deepep-dispatcher-output-dtype:
    kind: value
    type: str
    choices:
    - auto
    - bf16
    - fp8
    - int8
    - nvfp4
    default: auto
    help: Select DeepEP dispatcher output dtype
  deepep-mode:
    kind: value
    type: str
    choices:
    - auto
    - normal
    - low_latency
    default: auto
    help: Select the mode when enable DeepEP or MoriEP MoE, could be `normal`, `low_latency` or `auto`.
      Default is `auto`, which means `low_latency` for decode batch and `normal` for prefill batch.
  deepep-v2-mode:
    kind: value
    type: str
    choices:
    - direct
    - hybrid
    default: direct
    help: 'DeepEP v2 ElasticBuffer communication topology, fixed at server init: `direct` (single-node
      NVLink) or `hybrid` (multi-node scale-out). Layout/grouped-GEMM and the decode CUDA graph are chosen
      per batch by inference phase, independent of this knob; not equivalent to DeepEP v1 normal/low_latency.'
  default-chat-template-kwargs:
    kind: value
    type: loads
    help: Default chat template kwargs applied to every request when not overridden per-request. Keys
      must match what the model's chat template expects (e.g. enable_thinking, thinking, reasoning_effort).
      Per-request chat_template_kwargs takes precedence.
  default-priority-value:
    kind: value
    type: int
    help: Default priority for requests without explicit priority.
  delete-ckpt-after-loading:
    kind: flag
    help: Delete the model checkpoint after loading the model.
  detokenizer-worker-num:
    kind: value
    type: int
    default: 1
    help: The worker num of the detokenizer manager.
  device:
    kind: value
    type: str
    help: The device to use ('cuda', 'xpu', 'hpu', 'npu', 'cpu', 'musa'). Defaults to auto-detection if
      not specified.
  disable-attn-tp-gather:
    kind: flag
    help: Disable scheduler-side attn_tp_gather (the upstream SP path that pads num_tokens to attn_tp_size
      and pre-allocates a gathered buffer). Use for models that manage SP scatter/gather at the model
      level (e.g., perform their own all_gather/reduce_scatter inside attention) and do not consume the
      upstream gathered_buffer. Without this, the cuda graph runner pads num_tokens to attn_tp_size, which
      can cause kernel autotuners to select wrong-sized variants at small batches.
  disable-chunked-prefix-cache:
    kind: flag
    help: Disable chunked prefix cache feature for deepseek, which should save overhead for short sequences.
  disable-cuda-graph:
    kind: flag
    help: Deprecated. Use --cuda-graph-backend-{decode,prefill}=disabled instead.
    deprecated: true
  disable-cuda-graph-padding:
    kind: flag
    help: Disable cuda graph when padding is needed. Still uses cuda graph when padding is not needed.
  disable-custom-all-reduce:
    kind: flag
    help: Disable the custom all-reduce kernel and fall back to NCCL.
  disable-decode-cuda-graph:
    kind: flag
    help: Disable the decode-phase CUDA graph. Convenience for --cuda-graph-backend-decode=disabled.
  disable-fast-image-processor:
    kind: flag
    help: Deprecated. Use --image-processor-backend=pil instead.
  disable-flashinfer-autotune:
    kind: flag
    help: Disable FlashInfer autotuning.
  disable-flashinfer-cutlass-moe-fp4-allgather:
    kind: flag
    help: Disables quantize before all-gather for flashinfer cutlass moe.
  disable-hybrid-swa-memory:
    kind: flag
    help: Disable the hybrid SWA memory pool.
  disable-outlines-disk-cache:
    kind: flag
    help: Disable disk cache of outlines to avoid possible crashes related to file system or high concurrency.
  disable-overlap-schedule:
    kind: flag
    help: Disable the overlap scheduler, which overlaps the CPU scheduler with GPU model worker.
  disable-piecewise-cuda-graph:
    kind: flag
    help: Deprecated alias for --cuda-graph-backend-prefill=disabled.
    deprecated: true
  disable-prefill-cuda-graph:
    kind: flag
    help: Disable the prefill-phase CUDA graph. Convenience for --cuda-graph-backend-prefill=disabled.
  disable-priority-preemption:
    kind: flag
    help: Disable priority scheduling preemption.
  disable-radix-cache:
    kind: flag
    help: Disable RadixAttention for prefix caching.
  disable-shared-experts-fusion:
    kind: flag
    help: 'Disable the built-in shared experts fusion optimization for DeepSeek V3/R1. Note: Waterfill
      (--enable-waterfill) routes the shared expert as an extra MoE slot, so the shared expert is not
      separated from the MoE path when Waterfill is enabled.'
  disable-tokenizer-batch-decode:
    kind: flag
    help: Disable batch decoding when decoding multiple completions.
  disaggregation-bootstrap-port:
    kind: value
    type: int
    default: 8998
    help: Bootstrap server port on the prefill server. Default is 8998.
  disaggregation-decode-enable-offload-kvcache:
    kind: flag
    help: Enable async KV cache offloading on decode server (PD mode).
  disaggregation-decode-enable-radix-cache:
    kind: flag
    help: Enable radix cache on decode server (PD mode). Caches KV prefixes to avoid redundant transfers.
      Incompatible with --enable-hisparse, speculative decoding, and --disaggregation-transfer-backend
      fake.
  disaggregation-decode-extra-slots:
    kind: value
    type: int
    help: Number of extra decode req_to_token slots pre-allocated for in-transfer requests (PD mode).
      If unset, defaults to 0 (or 2x the per-worker running batch for small batches).
  disaggregation-decode-polling-interval:
    kind: value
    type: int
    default: 1
    help: The interval to poll requests in decode server. Can be set to >1 to reduce the overhead of this.
  disaggregation-decode-retraction-backup:
    kind: value
    type: str
    choices:
    - cpu_tensor
    - host_pool
    help: Storage backend for KV preserved across PD decode retraction. 'cpu_tensor' uses per-request
      CPU tensors. 'host_pool' uses a reserved HiCache pool and does not fall back on exhaustion. If omitted,
      the backend is inferred from the decode KV pool.
  disaggregation-ib-device:
    kind: value
    type: str
    help: 'The InfiniBand devices for disaggregation transfer. Supports a single device (e.g., --disaggregation-ib-device
      mlx5_0), a shared comma-separated list (e.g., --disaggregation-ib-device mlx5_0,mlx5_1), a per-GPU
      JSON mapping (e.g., --disaggregation-ib-device ''{"0": "mlx5_0,mlx5_1", "1": "mlx5_2"}''), or a
      path to a JSON file containing that mapping. Default is None, which triggers automatic device detection
      when mooncake backend is enabled.'
  disaggregation-mode:
    kind: value
    type: str
    choices:
    - 'null'
    - prefill
    - decode
    default: 'null'
    help: Only used for PD disaggregation. "prefill" for prefill-only server, and "decode" for decode-only
      server. If not specified, it is not PD disaggregated
  disaggregation-transfer-backend:
    kind: value
    type: str
    choices:
    - mooncake
    - nixl
    - ascend
    - fake
    - mori
    - mooncake_tcp
    default: mooncake
    help: The backend for disaggregation transfer. Default is mooncake.
  dist-init-addr:
    kind: value
    aliases:
    - nccl-init-addr
    type: str
    help: The host address for initializing distributed backend (e.g., `192.168.0.2:25000`).
  dist-timeout:
    kind: value
    type: int
    help: Set timeout for torch.distributed initialization.
  dllm-algorithm:
    kind: value
    type: str
    help: The diffusion LLM algorithm, such as LowConfidence.
  dllm-algorithm-config:
    kind: value
    type: str
    help: The diffusion LLM algorithm configurations. Must be a YAML file.
  dllm-fdfo:
    kind: bool
    default: true
    help: Enable First-Done-First-Out (FDFO) scheduling for diffusion LLM inference. Enabled by default;
      use --no-dllm-fdfo to fall back to synchronous block scheduling.
  download-dir:
    kind: value
    type: str
    help: Model download directory for huggingface.
  dp-size:
    kind: value
    aliases:
    - data-parallel-size
    type: int
    default: 1
    help: The data parallelism size.
  dsa-decode-backend:
    kind: value
    type: str
    choices:
    - flashmla_sparse
    - flashmla_sparse_q8
    - flashmla_kv
    - flashmla_auto
    - flashinfer_sparse_mla
    - fa3
    - tilelang
    - aiter
    - trtllm
    help: DSA (DeepSeek Sparse Attention) decode backend. If not specified, auto-detects based on hardware
      and kv_cache_dtype.
  dsa-paged-mqa-logits-backend:
    kind: value
    type: str
    choices:
    - auto
    - deepgemm
    - cutedsl
    - aiter
    default: auto
    help: 'DSA indexer paged MQA logits kernel backend. Options: ''auto'' (default; DeepGEMM on CUDA,
      aiter on ROCm), ''deepgemm'', ''cutedsl'' (CuTe DSL kernel, SM 100 (Blackwell) only; wins at low
      batch size and long context), ''aiter'' (ROCm only).'
  dsa-prefill-backend:
    kind: value
    type: str
    choices:
    - flashmla_sparse
    - flashmla_sparse_q8
    - flashmla_kv
    - flashmla_auto
    - flashinfer_sparse_mla
    - fa3
    - tilelang
    - aiter
    - trtllm
    help: DSA (DeepSeek Sparse Attention) prefill backend. If not specified, auto-detects based on hardware
      and kv_cache_dtype.
  dsa-prefill-cp-mode:
    kind: value
    type: str
    choices:
    - in-seq-split
    - round-robin-split
    default: round-robin-split
    help: '[Deprecated] Use --cp-strategy {zigzag,interleave} instead. ''in-seq-split'' maps to ''zigzag'';
      ''round-robin-split'' maps to ''interleave''.'
    deprecated: true
  dsa-topk-backend:
    kind: value
    type: str
    choices:
    - sgl-kernel
    - torch
    - flashinfer
    default: sgl-kernel
    help: 'DSA indexer top-k backend for the target model. Options: ''sgl-kernel'', ''torch'', ''flashinfer''.
      The ''torch'' backend currently requires SGLANG_DSA_FUSE_TOPK=false.'
  dsv4-prefill-backend:
    kind: value
    type: str
    choices:
    - auto
    - flashmla_sparse
    - flashmla_sparse_q8
    default: auto
    help: DeepSeek-V4 sparse prefill backend. 'auto' and 'flashmla_sparse' use the existing BF16 sparse
      prefill path; 'flashmla_sparse_q8' enables the Q8KV8 sparse prefill path.
  dtype:
    kind: value
    type: str
    choices:
    - auto
    - half
    - float16
    - bfloat16
    - float
    - float32
    default: auto
    help: 'Data type for model weights and activations.


      * "auto" will use FP16 precision for FP32 and FP16 models, and BF16 precision for BF16 models.

      * "half" for FP16. Recommended for AWQ quantization.

      * "float16" is the same as "half".

      * "bfloat16" for a balance between precision and range.

      * "float" is shorthand for FP32 precision.

      * "float32" for FP32 precision.'
  dwdp-size:
    kind: value
    type: int
    default: 1
    help: DWDP (Distributed Weight Data Parallelism) group size. When > 1, MoE prefill uses weight prefetch
      instead of token all-to-all. Must equal tp_size. Only supported with --disaggregation-mode null
      or prefill.
  dynamic-batch-tokenizer-batch-size:
    kind: value
    type: int
    default: 32
    help: '[Only used if --enable-dynamic-batch-tokenizer is set] Maximum batch size for dynamic batch
      tokenizer.'
  dynamic-batch-tokenizer-batch-timeout:
    kind: value
    type: float
    default: 0.002
    help: '[Only used if --enable-dynamic-batch-tokenizer is set] Timeout in seconds for batching tokenization
      requests.'
  elastic-ep-backend:
    kind: value
    type: str
    choices:
    - none
    - mooncake
    - nixl
    help: Specify the collective communication backend for elastic EP. Supports 'mooncake' and 'nixl'.
  elastic-ep-initial-size:
    kind: value
    type: int
    help: EP size used to define the immutable per-rank expert storage layout. Scale joiners must use
      the primary deployment's launch-time EP size.
  elastic-ep-join-mode:
    kind: value
    type: str
    choices:
    - scale
    - recover
    help: Join mode for elastic EP. 'recover' rejoins an existing slot after a fault. 'scale' joins as
      a new rank beyond the original group size and requires --node-rank 1.
  elastic-ep-join-rank-offset:
    kind: value
    type: int
    default: 0
    help: Global rank offset of an elastic EP joining group. Scale joiners must set this to the current
      effective EP size.
  elastic-ep-rejoin:
    kind: flag
    help: '[Deprecated] Alias for --elastic-ep-join-mode recover.'
  elastic-ep-scale-timeout:
    kind: value
    type: float
    default: 600
    help: Timeout in seconds for a pending elastic EP scale operation.
  enable-adaptive-dispatch-to-encoder:
    kind: flag
    help: 'When enabled, adaptively dispatch: multi-image requests go to encoder in language_only epd
      mode, single-image requests are processed locally.'
  enable-aiter-allreduce-fusion:
    kind: flag
    help: Enable Aiter AllReduce Fusion.
  enable-attn-tp-input-scattered:
    kind: flag
    help: Allow input of attention to be scattered when only using tensor parallelism, to reduce the computational
      load of operations such as qkv latent.
  enable-breakable-cuda-graph:
    kind: flag
    help: Deprecated alias for --cuda-graph-backend-prefill=breakable.
    deprecated: true
  enable-broadcast-mm-inputs-process:
    kind: flag
    help: Enable broadcast mm-inputs process in scheduler.
  enable-cache-report:
    kind: flag
    help: Return number of cached tokens in usage.prompt_tokens_details for each openai request.
  enable-cp-decode-attn-tp:
    kind: flag
    help: Enable attention tensor-parallel weight slicing during decode under context parallel (cp_size>1).
      Slices the replicated attention linears to the local CP partition, eliminating redundant decode
      GEMMs.
  enable-cudagraph-gc:
    kind: flag
    help: Enable garbage collection during CUDA graph capture. If disabled (default), GC is frozen during
      capture to speed up the process.
  enable-custom-logit-processor:
    kind: flag
    help: Enable users to pass custom logit processors to the server (disabled by default for security)
  enable-deepseek-v4-fp4-indexer:
    kind: flag
    help: Enable the experimental FP4 C4 indexer path for DeepSeek V4. Default keeps the existing indexer
      implementation.
  enable-dense-mlp-attn-tp:
    kind: flag
    help: Shard dense MLP weights across the attention TP group under DP attention.
  enable-deterministic-inference:
    kind: flag
    help: Enable deterministic inference mode with batch invariant ops.
  enable-dp-attention:
    kind: flag
    help: Enabling data parallelism for attention and tensor parallelism for FFN. The dp size should be
      equal to the tp size. Currently DeepSeek-V2 and Qwen 2/3 MoE models are supported.
  enable-dp-attention-local-control-broadcast:
    kind: flag
    help: With DP-attention, send control messages to every DP group leader and broadcast within attn_tp_group
      instead of the full tp_group. Eliminates a costly all-ranks gloo sync on every scheduler iteration.
  enable-dp-lm-head:
    kind: flag
    help: Enable vocabulary parallel across the attention TP group to avoid all-gather across DP groups,
      optimizing performance under DP attention.
  enable-draft-weights-cpu-backup:
    kind: flag
    help: Save draft model weights to CPU memory during release_weights_occupation and resume_weights_occupation
  enable-dsa-cache-layer-split:
    kind: flag
    help: Split DSA (DeepSeek Sparse Attention) GPU KV/indexer cache layers across context-parallel ranks
      to reduce per-rank KV memory. Currently only supported with the mooncake transfer backend (mooncake
      / mooncake_tcp); mori/nixl support will be added later by the community.
  enable-dsa-prefill-context-parallel:
    kind: flag
    help: '[Deprecated] Use --enable-prefill-cp instead.'
    deprecated: true
  enable-dynamic-batch-tokenizer:
    kind: flag
    help: Enable async dynamic batch tokenizer for improved performance when multiple requests arrive
      concurrently.
  enable-dynamic-chunking:
    kind: flag
    help: Enable dynamic chunk size adjustment for pipeline parallelism. When enabled, chunk sizes are
      dynamically calculated based on fitted function to maintain consistent execution time across chunks.
  enable-elastic-expert-backup:
    kind: flag
    help: Enable elastic expert backup feature.
  enable-eplb:
    kind: flag
    help: Enable EPLB algorithm
  enable-expert-distribution-metrics:
    kind: flag
    help: 'Removed. Use --expert-balancedness-report-mode with one of: off, server_log, prometheus, both.'
    deprecated: true
  enable-flashinfer-allreduce-fusion:
    kind: flag
    help: '(Deprecated: use --flashinfer-allreduce-fusion-backend=auto) Enable FlashInfer allreduce fusion
      with Residual RMSNorm.'
  enable-flexkv:
    kind: flag
    help: Route the default RadixCache through FlexKV's KVManager for host-tier (CPU / SSD / Remote) KV
      cache offload. Equivalent to --radix-cache-backend=flexkv but also participates in the auto-selection
      chain alongside --enable-lmcache.
  enable-forward-pass-metrics:
    kind: flag
    help: Enable per-iteration forward pass metrics via ZMQ IPC. External consumers (e.g. Dynamo planner)
      subscribe to the IPC endpoint exposed in server_args.forward_pass_metrics_ipc_name.
  enable-fp32-lm-head:
    kind: flag
    help: If set, the LM head outputs (logits) are in FP32.
  enable-fused-moe-sum-all-reduce:
    kind: flag
    help: Enable fused moe triton and sum all reduce.
  enable-fused-qk-norm-rope:
    kind: flag
    help: Enable fused qk normalization and rope rotary embedding.
  enable-gdn-replayssm-spec:
    kind: flag
    help: '[Deprecated] Use --enable-linear-replayssm-spec instead.'
    deprecated: true
  enable-hierarchical-cache:
    kind: flag
    help: Enable hierarchical cache
  enable-hisparse:
    kind: flag
    help: Enable hierarchical sparse attention
  enable-http2:
    kind: flag
    help: Use Granian instead of Uvicorn as the ASGI server, enabling HTTP/1.1 and HTTP/2 auto-negotiation.
      Clients may use h2c (cleartext HTTP/2) or plain HTTP/1.1. Requires 'pip install sglang[http2]'.
  enable-int8-mamba-checkpoint:
    kind: flag
    help: Store radix-cached linear-attn (mamba) states in int8 (separate checkpoint pool) for ~2x cached-prefix
      capacity at fixed memory.
  enable-layernorm-sp:
    kind: flag
    help: 'Enable Megatron-style sequence parallelism (arXiv:2205.05198) for the LayerNorm/residual regions
      under pure tensor parallelism: the row-parallel all-reduce becomes reduce-scatter + all-gather,
      so LayerNorm runs on sequence-sharded activations with no extra communication volume. Prefill only;
      Qwen3 dense; requires tp_size > 1 and NVLink/NVSwitch.'
  enable-layerwise-nvtx-marker:
    kind: flag
    help: Enable layerwise NVTX profiling annotations for the model.
  enable-lean-attention:
    kind: flag
    help: Enable Lean (Work-Centric) Attention decode kernel for long-context serving. When None (default),
      uses auto-gate that activates Lean for long contexts and falls back to standard kernel for short
      contexts. Set to True to force enable, False to force disable.
  enable-linear-replayssm:
    kind: flag
    help: Enable the ReplaySSM buffered output-only linear-attn decode kernel. Primarily a GDN (scalar-gate)
      decode-bandwidth optimization (~1.2-1.5x at batch >= 64). KDA uses its selected Triton or Helion
      implementation, but its per-K gate ring is larger and ReplaySSM is typically slower than packed
      KDA decode; benchmark before enabling it. Requires the Triton linear-attn decode backend, or Helion
      for KDA, and --mamba-radix-cache-strategy no_buffer (the default).
  enable-linear-replayssm-spec:
    kind: flag
    help: 'Enable the ReplaySSM spec-verify: fold-every-commit -- a per-slot raw-input window replaces
      the recurrent verify''s per-draft full-state snapshots. GDN or KDA hybrid linear-attn models, linear-chain
      (--speculative-eagle-topk in {None, 1}) only.'
  enable-lmcache:
    kind: flag
    help: Using LMCache as an alternative hierarchical cache solution
  enable-lora:
    kind: flag
    help: Enable LoRA support for the model. This argument is automatically set to True if `--lora-paths`
      is provided for backward compatibility.
  enable-lora-overlap-loading:
    kind: flag
    help: Enable asynchronous LoRA weight loading in order to overlap H2D transfers with GPU compute.
      This should be enabled if you find that your LoRA workloads are bottlenecked by adapter weight loading,
      for example when frequently loading large LoRA adapters.
  enable-mamba-cache-stochastic-rounding:
    kind: flag
    help: Enable stochastic rounding when writing FP16 Mamba SSM cache states. Requires --mamba-ssm-dtype
      float16 and CUDA. With --mamba-backend triton, requires SM100.
  enable-memory-saver:
    kind: flag
    help: Allow saving memory using release_memory_occupation and resume_memory_occupation
  enable-metrics:
    kind: flag
    help: Enable log prometheus metrics.
  enable-metrics-for-all-schedulers:
    kind: flag
    help: Enable --enable-metrics-for-all-schedulers when you want schedulers on all TP ranks (not just
      TP 0) to record request metrics separately. This is especially useful when dp_attention is enabled,
      as otherwise all metrics appear to come from TP 0.
  enable-mfu-metrics:
    kind: flag
    help: Enable estimated MFU-related prometheus metrics.
  enable-mis:
    kind: flag
    help: Enable Multi-Item Scoring optimization. Combines query and multiple items into a single sequence
      for efficient batch processing. Requires --attention-backend flashinfer; auto-disables CUDA graph,
      radix cache, and chunked prefill.
  enable-mixed-chunk:
    kind: flag
    help: Enabling mixing prefill and decode in a batch when using chunked prefill.
  enable-mm-global-cache:
    kind: flag
    help: Enable global multimodal embedding cache to skip redundant ViT inference.
  enable-mscclpp:
    kind: flag
    help: Enable using mscclpp for small messages for all-reduce kernel and fall back to NCCL.
  enable-multi-layer-eagle:
    kind: flag
    help: Enable multi-layer Eagle speculative decoding.
  enable-multimodal:
    kind: flag
    help: Enable the multimodal functionality for the served model. If the model being served is not multimodal,
      nothing will happen
  enable-nccl-nvls:
    kind: flag
    help: Enable NCCL NVLS for prefill heavy requests when available.
  enable-nsa-prefill-context-parallel:
    kind: flag
    help: '[Deprecated] Use --enable-prefill-cp instead.'
    deprecated: true
  enable-p2p-check:
    kind: flag
    help: Enable P2P check for GPU access, otherwise the p2p access is allowed by default.
  enable-page-major-kv-layout:
    kind: flag
    help: 'Enable the page-major KV layout: lay out the Mamba state and full/SWA KV caches in a page-granularity
      envelope (page is the outermost axis, layer-major within a page) instead of the default per-layer
      (layer-major) layout. Requires the Triton attention / linear-attn / Mamba backends.'
  enable-pdmux:
    kind: flag
    help: Enable PD-Multiplexing, PD running on greenctx stream.
  enable-precise-embedding-interpolation:
    kind: flag
    help: Enable corner alignment for resize of embeddings grid to ensure more accurate(but slower) evaluation
      of interpolated embedding values.
  enable-prefill-context-parallel:
    kind: flag
    help: '[Deprecated] Use --enable-prefill-cp instead.'
    deprecated: true
  enable-prefill-cp:
    kind: flag
    help: Enable context parallelism for the prefill phase. Select the layout with --cp-strategy.
  enable-prefill-delayer:
    kind: flag
    help: Enable prefill delayer for DP attention to reduce idle time.
  enable-prefix-mm-cache:
    kind: flag
    help: Enable prefix multimodal cache. Currently only supports mm-only.
  enable-priority-scheduling:
    kind: flag
    help: Enable priority scheduling. Requests with higher priority integer values will be scheduled first
      by default.
  enable-profile-cuda-graph:
    kind: flag
    help: Enable profiling of cuda graph capture.
  enable-quant-communications:
    kind: flag
    help: Enable INT8 quantization of TP communications (limited support).
  enable-request-time-stats-logging:
    kind: flag
    help: Enable per request time stats logging
  enable-return-hidden-states:
    kind: flag
    help: Enable returning full hidden states with responses. Equivalent to `--return-hidden-states-mode
      full`.
  enable-return-indexer-topk:
    kind: flag
    help: Enable returning indexer topk indices of layers with indexer with responses.
  enable-return-routed-experts:
    kind: flag
    help: Enable returning routed experts of each layer with responses.
  enable-scattered-sconv:
    kind: flag
    help: 'Inkling: replace the attention/MLP output all-reduce with a hidden-dimension reduce-scatter,
      run the channelwise output short convolution on the [T, H/P] shard, then all-gather before the residual
      add. This shards the convolution cache across tensor-parallel ranks without changing communication
      volume.'
  enable-session-radix-cache:
    kind: flag
    help: 'Track per-session references on UnifiedRadixCache KV: eviction consumes unreferenced entries
      before referenced ones, and closing a session only dereferences its KV.'
  enable-shared-experts-attn-tp:
    kind: flag
    help: Shard shared expert weights across the attention TP group when using an expert-parallel all-to-all
      backend.
  enable-single-batch-overlap:
    kind: flag
    help: Let computation and communication overlap within one micro batch.
  enable-ssl-refresh:
    kind: flag
    help: Enable automatic SSL certificate hot-reloading when cert/key files change on disk. Requires
      --ssl-certfile and --ssl-keyfile.
  enable-streaming-session:
    kind: flag
    help: Enable streaming session mode and StreamingSession wrapper.
  enable-strict-thinking:
    kind: flag
    help: Enable strict token filtering during the thinking phase. Blocks model-specific excluded tokens
      (e.g., tool call markers) during reasoning. Requires a grammar backend that supports token filtering.
  enable-symm-mem:
    kind: flag
    help: Enable NCCL symmetric memory for fast collectives.
  enable-tf32-matmul:
    kind: flag
    help: Enable float32 matmuls to use TensorFloat32 precision for better performance (via torch.set_float32_matmul_precision).
      CUDA only.
  enable-tokenizer-batch-encode:
    kind: flag
    help: Enable batch tokenization for improved performance when processing multiple text inputs. Do
      not use with image inputs, pre-tokenized input_ids, or input_embeds.
  enable-torch-compile:
    kind: flag
    help: Optimize the model with torch.compile. Experimental feature.
  enable-torch-compile-debug-mode:
    kind: flag
    help: Enable debug mode for torch compile
  enable-torch-symm-mem:
    kind: flag
    help: Enable using torch symm mem for all-reduce kernel and fall back to NCCL. Only supports CUDA
      device SM90 and above. SM90 supports world size 4, 6, 8. SM100 supports world size 6, 8.
  enable-tp-lm-head-all-to-all:
    kind: bool
    help: Use all-to-all instead of TP all-gather followed by DP scatter for the TP-sharded LM head under
      DP attention. By default this is enabled only on decode-only PD nodes with pure DP attention (tp_size
      == dp_size > 1 and attn_cp_size == 1), and disabled on prefill-only and colocated nodes. Pass --no-enable-tp-lm-head-all-to-all
      to opt out. The path is incompatible with --enable-dp-lm-head; batches without an equal padded row
      count fall back to the existing all-gather path.
  enable-trace:
    kind: flag
    help: Enable opentelemetry trace
  enable-two-batch-overlap:
    kind: flag
    help: Enabling two micro batches to overlap.
  enable-unified-memory:
    kind: flag
    help: Replace the statically-partitioned hybrid-model pools (full-attn KV + SWA/Mamba state) with
      one byte buffer split dynamically between sub-pools. Requires the Triton attention / linear-attn
      / Mamba backends; not yet compatible with PD disaggregation or speculative decoding.
  enable-w4a4-mxfp4-megamoe:
    kind: flag
    help: Enable the W4A4 MXFP4 MegaMoE path with DeepGEMM's mxf4xmxf4 MMA type. Use with --moe-a2a-backend
      megamoe.
  enable-waterfill:
    kind: flag
    help: 'Enable Waterfill: dispatch the fused shared expert as an extra routed expert slot to the least-loaded
      EP rank. Supports DeepEP and MegaMOE MoE A2A backends, implicitly enables shared-expert fusion,
      and supports --deepep-mode auto, normal, or low_latency when used with DeepEP. Use auto or low_latency
      for production DeepEP decode so CUDA graph remains enabled. Supported on DeepSeek-V3/R1 with EP
      >= 2.'
  enable-weights-cpu-backup:
    kind: flag
    help: Save model weights (both main model and draft model, if any) to CPU memory during release_weights_occupation
      and resume_weights_occupation
  encoder-bootstrap-port:
    kind: value
    type: int
    default: 8997
    help: Port for the EncoderBootstrapServer that runs in the language-only tokenizer manager process.
      Encoders register here, and language-only receivers fetch the current URL list from here.
  encoder-only:
    kind: flag
    help: For MLLM with an encoder, launch an encoder-only server
  encoder-register-urls:
    kind: value
    nargs: +
    type: str
    default: []
    help: 'One or more EncoderBootstrapServer URLs to register this encoder with on startup, for dynamic
      encoder discovery. Example: --encoder-register-urls http://prefill0:8997 http://prefill1:8997. Used
      with --encoder-only servers.'
  encoder-transfer-backend:
    kind: value
    type: str
    choices:
    - auto
    - zmq_to_scheduler
    - zmq_to_tokenizer
    - mooncake
    default: auto
    help: The backend for encoder disaggregation transfer. Auto selects a model- and TP-aware backend.
  encoder-urls:
    kind: value
    nargs: +
    type: str
    default: []
    help: List of encoder server urls.
  enforce-disable-flashinfer-allreduce-fusion:
    kind: flag
    help: Enforce disable FlashInfer allreduce fusion.
  enforce-piecewise-cuda-graph:
    kind: flag
    help: Deprecated alias for --cuda-graph-backend-prefill=tc_piecewise. Explicitly setting the prefill
      backend now skips the auto-disable cascade automatically.
    deprecated: true
  enforce-shared-experts-fusion:
    kind: flag
    help: Enforce shared experts fusion even when it would normally be disabled (e.g. under DeepEP). Mutually
      exclusive with --disable-shared-experts-fusion.
  engine-info-bootstrap-port:
    kind: value
    type: int
    default: 6789
    help: Port for the engine info bootstrap server. Default is 6789. Must be set explicitly when running
      multiple instances on the same node.
  ep-dispatch-algorithm:
    kind: value
    type: str
    choices:
    - static
    - dynamic
    - fake
    - lp
    help: The algorithm to choose ranks for redundant experts in expert parallel.
  ep-num-redundant-experts:
    kind: value
    type: int
    default: 0
    help: Allocate this number of redundant experts in expert parallel.
  ep-size:
    kind: value
    aliases:
    - expert-parallel-size
    - ep
    type: int
    default: 1
    help: The expert parallelism size.
  eplb-algorithm:
    kind: value
    type: str
    default: auto
    help: Chosen EPLB algorithm
  eplb-min-rebalancing-utilization-threshold:
    kind: value
    type: float
    default: 1.0
    help: Minimum threshold for GPU average utilization to trigger EPLB rebalancing. Must be in the range
      [0.0, 1.0].
  eplb-rebalance-layers-per-chunk:
    kind: value
    type: int
    help: Number of layers to rebalance per forward pass.
  eplb-rebalance-num-iterations:
    kind: value
    type: int
    default: 1000
    help: Number of iterations to automatically trigger a EPLB re-balance.
  expert-balancedness-report-mode:
    kind: value
    type: str
    choices:
    - 'off'
    - server_log
    - prometheus
    - both
    default: 'off'
    help: 'Where to report expert balancedness. Options: off, server_log, prometheus, both.'
  expert-distribution-recorder-buffer-size:
    kind: value
    type: int
    help: Circular buffer size of expert distribution recorder. Set to -1 to denote infinite buffer.
  expert-distribution-recorder-mode:
    kind: value
    type: str
    choices:
    - stat
    - stat_approx
    - per_pass
    - per_token
    help: Mode of expert distribution recorder.
  experts-shared-outer-loras:
    kind: bool
    help: Force shared outer LoRA mode for MoE models. When set, w1/w3 lora_A and w2 lora_B are shared
      across experts (expert_dim=1). Use --no-experts-shared-outer-loras to force disable. By default
      this is auto-detected from adapter weights.
  export-metrics-to-file:
    kind: flag
    help: Export performance metrics for each request to local file (e.g. for forwarding to external systems).
  export-metrics-to-file-dir:
    kind: value
    type: str
    help: Directory path for writing performance metrics files (required when --export-metrics-to-file
      is enabled).
  extra-metric-labels:
    kind: value
    type: loads
    help: 'The custom labels for metrics. e.g. ''{"label1": "value1", "label2": "value2"}'''
  fastapi-root-path:
    kind: value
    type: str
    default: ''
    help: App is behind a path based routing proxy.
  file-storage-path:
    kind: value
    type: str
    default: sglang_storage
    help: The path of the file storage in backend.
  flashinfer-allreduce-fusion-backend:
    kind: value
    type: str
    choices:
    - auto
    - trtllm
    - mnnvl
    help: 'Enable FlashInfer allreduce fusion and choose backend. Requires SM90 or SM10X NVIDIA GPUs.
      Defaults to auto. ''auto'': choose mnnvl on Blackwell (SM100/SM103) systems (single- and multi-node)
      and trtllm on SM90 single-node systems. ''trtllm'': available on single-node systems only. ''mnnvl'':
      available on SM90 single-node systems and SM100/SM103 single-node or multi-node systems via MNNVL
      fabric. Fuses allreduce with Residual + RMSNorm for supported MoE models.'
  flashinfer-autotune-skip-ops:
    kind: value
    nargs: +
    type: str
    help: FlashInfer custom-op identifiers to skip during autotuning. Skipped ops use FlashInfer's heuristic
      fallback. SGLang temporarily skips mxfp8_gemm by default due to an IMA.
  flashinfer-mla-disable-ragged:
    kind: flag
    help: Not using ragged prefill wrapper when running flashinfer mla
  flashinfer-mxfp4-moe-precision:
    kind: value
    type: str
    choices:
    - default
    - bf16
    - fp8
    default: default
    help: 'Choose the computation precision of flashinfer mxfp4 moe. On SM90, `fp8` selects the Humming-style
      MXFP4-weight x FP8-activation path introduced by FlashInfer #3738 and requires FlashInfer >= 0.6.18.'
  flexkv-config-file:
    kind: value
    type: str
    help: Path to the FlexKV YAML / JSON configuration file. Equivalent to setting the FLEXKV_CONFIG_PATH
      environment variable.
  forward-hooks:
    kind: value
    type: json_list_type
    help: JSON-formatted forward hook specifications to attach to the model.
  forward-pass-metrics-ipc-name:
    kind: value
    type: str
    help: ==SUPPRESS==
  forward-pass-metrics-worker-id:
    kind: value
    type: str
    default: ''
    help: ==SUPPRESS==
  fp4-gemm-backend:
    kind: value
    type: str
    choices:
    - auto
    - flashinfer_cudnn
    - flashinfer_cutedsl
    - flashinfer_cutlass
    - flashinfer_trtllm
    - marlin
    default: auto
    help: 'Choose the runner backend for NVFP4 GEMM operations. Options: ''auto'' (default; selects flashinfer_cutedsl
      on SM100, marlin on SM80-SM90, flashinfer_cutlass otherwise (including SM120)), ''flashinfer_cutlass''
      (FlashInfer CUTLASS backend), ''flashinfer_cudnn'' (FlashInfer cuDNN backend, optimal on CUDA 13+
      with cuDNN 9.15+), ''flashinfer_cutedsl'' (FlashInfer CuTe DSL backend), ''flashinfer_trtllm'' (FlashInfer
      TensorRT-LLM backend, requires different weight preparation with shuffling), ''marlin'' (weight-only
      W4A16 fallback for SM80+). '
  fp8-gemm-backend:
    kind: value
    type: str
    choices:
    - auto
    - deep_gemm
    - flashinfer_trtllm
    - flashinfer_cutlass
    - flashinfer_deepgemm
    - flashinfer_cutedsl
    - cutlass
    - triton
    - aiter
    default: auto
    help: 'Choose the runner backend for Blockwise FP8 GEMM operations. Options: ''auto'' (default, auto-selects
      based on hardware; MXFP8 dense picks flashinfer_cutedsl on SM100/SM103 and FlashInfer CUTLASS on
      other supported Blackwell GPUs), ''deep_gemm'' (JIT-compiled; enabled by default on NVIDIA Hopper
      (SM90) and Blackwell (SM100) when DeepGEMM is installed), ''flashinfer_trtllm'' (optimal for Blackwell
      and low-latency), ''flashinfer_cutlass'' (FlashInfer CUTLASS groupwise FP8 GEMM), ''flashinfer_cutedsl''
      (FlashInfer CuTe DSL MXFP8 GEMM on SM100/SM103), ''flashinfer_deepgemm'' (Hopper SM90 only; uses
      swapAB optimization for small M dimensions in decoding), ''cutlass'' (optimal for SM120 GPUs), ''triton''
      (fallback, widely compatible), ''aiter'' (ROCm only). '
  fuseep-mode:
    kind: value
    type: int
    choices:
    - 1
    - 2
    default: 2
    help: "Select the mode when enable Ascend FuseEP MoE, 1 -> dispatch_gmm_combine_decode is executed\uFF1B\
      2 -> dispatch_ffn_combine is executed (support hybrid deployment when 2)."
  gated-launch-port:
    kind: value
    type: int
    help: The port of the gated launch control server. When set, every rank blocks right after the distributed
      environment is initialized, before any sizable GPU allocation, until `POST /gate/activate` is sent
      to this port on the host of the first rank. This lets an external orchestrator defer the memory
      hungry part of startup to a safe window. Defaults to None, which disables the gate.
  gc-threshold:
    kind: value
    nargs: +
    type: int
    help: Set the garbage collection thresholds (the collection frequency). Accepts 1 to 3 integers.
  gc-warning-threshold-secs:
    kind: value
    type: float
    default: 0.0
    help: The threshold for long GC warning. If a GC takes longer than this, a warning will be logged.
      Set to 0 to disable.
  generation-tokens-buckets:
    kind: value
    nargs: +
    type: str
    help: 'The buckets rule for generation tokens histogram. Supports 3 rule types: ''default'' uses predefined
      buckets; ''tse <middle> <base> <count>'' generates two sides exponential distributed buckets (e.g.,
      ''tse 1000 2 8'' generates buckets [984.0, 992.0, 996.0, 998.0, 1000.0, 1002.0, 1004.0, 1008.0,
      1016.0]).); ''custom <value1> <value2> ...'' uses custom bucket values (e.g., ''custom 10 50 100
      500'').'
  gpu-id-step:
    kind: value
    type: int
    default: 1
    help: The delta between consecutive GPU IDs that are used. For example, setting it to 2 will use GPU
      0,2,4,...
  grammar-backend:
    kind: value
    type: str
    choices:
    - xgrammar
    - outlines
    - llguidance
    - none
    help: Choose the backend for grammar-guided decoding.
  grpc-mode:
    kind: flag
    help: (Deprecated, use --smg-grpc-mode) Legacy SMG gRPC server selector.
  grpc-port:
    kind: value
    type: int
    help: Port for the native gRPC server, started alongside HTTP. Setting this (or SGLANG_GRPC_PORT)
      enables the native gRPC server; it is off by default. In legacy --smg-grpc-mode this is the SMG
      server port and defaults to --port + 10000.
  hf-chat-template-name:
    kind: value
    type: str
    help: When the HuggingFace tokenizer has multiple chat templates (e.g., 'default', 'tool_use', 'rag'),
      specify which named template to use. If not set, the first available template is used.
  hicache-host-memory-mode:
    kind: value
    type: str
    choices:
    - cache
    - buffer_only
    default: cache
    help: Whether host memory is a persistent HiCache tier (cache) or a transient staging buffer between
      GPU and the storage backend (buffer_only). buffer_only requires --hicache-storage-backend.
  hicache-io-backend:
    kind: value
    type: str
    choices:
    - direct
    - kernel
    - kernel_ascend
    default: kernel
    help: The IO backend for KV cache transfer between CPU and GPU
  hicache-mem-layout:
    kind: value
    type: str
    choices:
    - layer_first
    - page_first
    - page_first_direct
    - page_first_kv_split
    - page_head
    default: page_first
    help: The layout of host memory pool for hierarchical cache.
  hicache-ratio:
    kind: value
    type: float
    help: The ratio of the size of host KV cache memory pool to the size of device pool. Defaults to 2.0
      in cache mode, 1.2 in buffer_only mode, or 0.2 for backup-only host-pool decode retraction.
  hicache-size:
    kind: value
    type: int
    default: 0
    help: The size of host KV cache memory pool in gigabytes. Overrides --hicache-ratio in either host
      memory mode.
  hicache-storage-backend:
    kind: value
    type: str
    choices:
    - file
    - sim
    - mooncake
    - hf3fs
    - nixl
    - aibrix
    - dynamic
    - eic
    - simm
    - mori
    - shm
    help: 'The storage backend for hierarchical KV cache. Built-in backends: file, mooncake, hf3fs, nixl,
      aibrix. For dynamic backend, use --hicache-storage-backend-extra-config to specify: backend_name
      (custom name), module_path (Python module path), class_name (backend class name).'
  hicache-storage-backend-extra-config:
    kind: value
    type: str
    help: A dictionary in JSON string format, or a string starting with a leading '@' and a config file
      in JSON/YAML/TOML format, containing extra configuration for the storage backend.
  hicache-storage-prefetch-policy:
    kind: value
    type: str
    choices:
    - best_effort
    - wait_complete
    - timeout
    default: timeout
    help: Control when prefetching from the storage backend should stop.
  hicache-storage-prefetch-retry-max-attempts:
    kind: value
    type: int
    default: 4
    help: Maximum storage prefetch retries per request when --hicache-storage-prefetch-retry-poll-interval
      is set.
  hicache-storage-prefetch-retry-poll-interval:
    kind: value
    type: int
    default: 0
    help: Scheduling passes a queued request waits after a storage prefetch miss before the availability
      check is retried (under load the first check can run before the needed backup commits). 0 disables
      retries.
  hicache-write-policy:
    kind: value
    type: str
    choices:
    - write_back
    - write_through
    - write_through_selective
    default: write_through
    help: The write policy of hierarchical cache.
  hisparse-config:
    kind: value
    aliases:
    - hierarchical-sparse-attention-extra-config
    type: str
    help: 'A dictionary in JSON string format for hierarchical sparse attention configuration. Example:
      ''{"top_k": 2048, "device_buffer_size": 4096, "host_to_device_ratio": 2}'''
  host:
    kind: value
    type: str
    default: 127.0.0.1
    help: The host of the HTTP server.
  http2-initial-connection-window-size:
    kind: value
    type: int
    default: 1048576
    help: Initial connection-level HTTP/2 receive window in bytes (1024 to 2^31 - 1). Only applies with
      --enable-http2.
  http2-max-concurrent-streams:
    kind: value
    type: int
    default: 200
    help: Maximum number of concurrent streams advertised on each HTTP/2 connection (1 to 2^32 - 1). Only
      applies with --enable-http2.
  image-processor-backend:
    kind: value
    type: str
    choices:
    - auto
    - torchvision
    - pil
    default: auto
    help: Image processor backend. 'auto' lets Transformers select the best available backend.
  incremental-streaming-output:
    kind: flag
    help: Whether to output as a sequence of disjoint segments.
  init-expert-location:
    kind: value
    type: str
    default: trivial
    help: Initial location of EP experts.
  int8-mamba-ckpt-size:
    kind: value
    type: int
    help: 'Number of int8 mamba checkpoint slots (default: 2x the active mamba pool size).'
  is-embedding:
    kind: flag
    help: Whether to use a CausalLM as an embedding model.
  json-model-override-args:
    kind: value
    type: str
    default: '{}'
    help: A dictionary in JSON string format used to override default model configurations.
  keep-mm-feature-on-device:
    kind: flag
    help: Deprecated. Use --mm-feature-transport=cuda_ipc for bounded GPU-resident multimodal feature
      transport.
  kt-cpuinfer:
    kind: value
    type: int
    help: '[ktransformers parameter] The number of CPUInfer threads.'
  kt-max-deferred-experts-per-token:
    kind: value
    type: int
    help: '[ktransformers parameter] Maximum number of experts deferred to CPU per token. All MoE layers
      except the final one use this value; the final layer always uses 0.'
  kt-method:
    kind: value
    type: str
    default: AMXINT4
    help: '[ktransformers parameter] Quantization formats for CPU execution.'
  kt-num-gpu-experts:
    kind: value
    type: int
    help: '[ktransformers parameter] The number of GPU experts.'
  kt-threadpool-count:
    kind: value
    type: int
    default: 2
    help: '[ktransformers parameter] One-to-one with the number of NUMA nodes (one thread pool per NUMA).'
  kt-weight-path:
    kind: value
    type: str
    help: '[ktransformers parameter] The path of the quantized expert weights for amx kernel. A local
      folder.'
  kv-cache-dtype:
    kind: value
    type: str
    choices:
    - auto
    - fp8_e5m2
    - fp8_e4m3
    - mxfp8
    - bf16
    - bfloat16
    - nvfp4
    - fp4_mx_block16
    - fp4_e2m1
    default: auto
    help: Data type for kv cache storage. "auto" will use model data type. "bf16" or "bfloat16" for BF16
      KV cache. "fp8_e5m2" and "fp8_e4m3" are supported for CUDA 11.8+. "mxfp8" is supported by the FA4
      backend. "nvfp4" selects the NVFP4 FP4 E2M1 KV cache recipe; "fp4_mx_block16" selects the MX-style
      block-size-16 FP4 E2M1 KV cache recipe. Both require CUDA 12.8+ and PyTorch 2.8.0+
  kv-canary:
    kind: value
    type: str
    choices:
    - none
    - log
    - raise
    default: none
    help: KV cache canary mode. 'none' disables the canary (default). 'log' prints them while the server
      keeps running (production-safe). 'raise' fails the server on the first detected mismatch (CI lane).
  kv-canary-real-data:
    kind: value
    type: str
    choices:
    - none
    - partial
    - all
    default: none
    help: Check the real KV-cache in the canary. 'none' (default) disables the feature. 'partial' checks
      the first 16 bytes of each real-KV slot. 'all' checks the full real-KV slot.
  kv-canary-sweep-interval:
    kind: value
    type: int
    default: 0
    help: Every N forward steps, run a full-pool sweep.
  kv-events-config:
    kind: value
    type: str
    help: Config in json format for NVIDIA dynamo KV event publishing. Publishing will be enabled if this
      flag is used. Runtime-load publishing for load-aware routers is a separate opt-in; see --load-publish-endpoint.
  language-model-only:
    kind: flag
    help: 'Skip the multimodal encoder entirely: its weights are never loaded and the tower is never built,
      freeing that GPU memory for KV cache. Multimodal requests are rejected. Unlike --language-only this
      is a standalone mode, not part of encoder/decoder disaggregation.'
  language-only:
    kind: flag
    help: For VLM, load weights for the language model only.
  limit-mm-data-per-request:
    kind: value
    type: loads
    help: 'Limit the number of multimodal inputs per request. e.g. ''{"image": 1, "video": 1, "audio":
      1}'''
  linear-attn-backend:
    kind: value
    type: str
    choices:
    - triton
    - cutedsl
    - flashinfer
    - flashkda
    - nvidia_kda
    - ptx_kda
    - helion
    - intel_xpu
    default: triton
    help: The default kernel backend for linear attention (GDN/KDA). Can be overridden per-mode by --linear-attn-decode-backend
      and --linear-attn-prefill-backend. The Helion backend is KDA-only.
  linear-attn-decode-backend:
    kind: value
    type: str
    choices:
    - triton
    - cutedsl
    - flashinfer
    - flashkda
    - nvidia_kda
    - ptx_kda
    - helion
    - intel_xpu
    help: Override the kernel backend for linear attention decode. If not set, uses --linear-attn-backend.
  linear-attn-prefill-backend:
    kind: value
    type: str
    choices:
    - triton
    - cutedsl
    - flashinfer
    - flashkda
    - nvidia_kda
    - ptx_kda
    - helion
    - intel_xpu
    help: Override the kernel backend for linear attention prefill/extend. If not set, uses --linear-attn-backend;
      compatible SM100 GDN models may automatically select FlashInfer.
  linear-attn-verify-backend:
    kind: value
    type: str
    choices:
    - triton
    - cutedsl
    - flashinfer
    - flashkda
    - nvidia_kda
    - ptx_kda
    - helion
    - intel_xpu
    - nv_cutedsl
    help: Override the kernel backend for linear attention speculative target-verify. If not set, follows
      the decode backend (flashinfer decode -> flashinfer verify, otherwise triton). KDA supports triton,
      nv_cutedsl, and flashinfer verify backends.
  linear-replayssm-cache-len:
    kind: value
    type: int
    default: 16
    help: Ring-buffer length L for ReplaySSM linear-attn decode. The full recurrent state is flushed to
      HBM every L decode steps.
  lmcache-config-file:
    kind: value
    type: str
    help: Path to the LMCache YAML configuration file
  load-balance-method:
    kind: value
    type: str
    choices:
    - auto
    - round_robin
    - follow_bootstrap_room
    - total_requests
    - total_tokens
    default: auto
    help: The load balancing strategy for data parallelism.
  load-format:
    kind: value
    type: str
    choices:
    - auto
    - pt
    - safetensors
    - npcache
    - dummy
    - sharded_state
    - presharded
    - gguf
    - expert_pack
    - bitsandbytes
    - mistral
    - layered
    - flash_rl
    - remote
    - remote_instance
    - fastsafetensors
    - private
    - runai_streamer
    default: auto
    help: 'The format of the model weights to load. "auto" will try to load the weights in the safetensors
      format and fall back to the pytorch bin format if safetensors format is not available. "pt" will
      load the weights in the pytorch bin format. "safetensors" will load the weights in the safetensors
      format. "npcache" will load the weights in pytorch format and store a numpy cache to speed up the
      loading. "dummy" will initialize the weights with random values, which is mainly for profiling."gguf"
      will load the weights in the gguf format. "expert_pack" is experimental and loads only the validated
      DeepSeek-V4-Flash-0731 MXFP4 or text-only Kimi-K3 Q2_K GGUF model with routed experts stored in
      an SSD expert pack. "bitsandbytes" will load the weights using bitsandbytes quantization."layered"
      loads weights layer by layer so that one can quantize a layer before loading another to make the
      peak memory envelope smaller."presharded" performs a normal first-time load (with quantization),
      then dumps a per-rank/per-tensor sharded checkpoint with content deduplication into <model_path>/presharded/<parallelism+quant
      subfolder>/. Subsequent runs with the same parallelism+quantization config load directly from this
      presharded checkpoint and skip re-quantization. The dump directory must be on a shared filesystem
      across all ranks/nodes. Optional model_loader_extra_config roots: presharded_path (target) and draft_presharded_path
      (speculative draft); each replaces <model_path>/presharded and still gets a config subfolder appended.
      Use a writable path when model_path is read-only (e.g. HF cache mounts).'
  load-publish-endpoint:
    kind: value
    type: str
    help: "Opt in to the runtime-load PUB socket that load-aware routers subscribe to. Off by default\
      \ (unset or 'off'). Use 'auto' to reserve the dp_size ports packed after the --kv-events-config\
      \ range, or a wildcard-host TCP address (e.g. tcp://*:6000) to place it explicitly; rank r binds\
      \ port+r and /server_info advertises the base under the kv_events block. Requires --kv-events-config\
      \ to describe a publisher (routers discover the base through /server_info); startup fails if this\
      \ is set without one, is not bindable, or overlaps the KV range. Note: 'auto' reserves 2*dp_size\
      \ ports from the KV base \u2014 space co-hosted engines accordingly. The router-facing update cadence\
      \ follows --load-snapshot-publish-interval (shared to avoid double-collecting the snapshot), so\
      \ a large value there also staleness-caps this feed."
  load-snapshot-publish-interval:
    kind: value
    type: int
    default: 15
    help: Publish load snapshot to shared memory every N decode iterations. Prefill and idle always publish
      immediately.
  log-level:
    kind: value
    type: str
    default: info
    help: The logging level of all loggers.
  log-level-http:
    kind: value
    type: str
    help: The logging level of HTTP server. If not set, reuse --log-level by default.
  log-requests:
    kind: flag
    help: Log metadata, inputs, outputs of all requests. The verbosity is decided by --log-requests-level
  log-requests-format:
    kind: value
    type: str
    choices:
    - text
    - json
    default: text
    help: 'Format for request logging: ''text'' (human-readable) or ''json'' (structured)'
  log-requests-level:
    kind: value
    type: int
    choices:
    - 0
    - 1
    - 2
    - 3
    default: 2
    help: '0: Log metadata (no sampling parameters). 1: Log metadata and sampling parameters. 2: Log metadata,
      sampling parameters and partial input/output. 3: Log every input/output.'
  log-requests-target:
    kind: value
    nargs: +
    type: str
    help: 'Target(s) for request logging: ''stdout'' and/or directory path(s) for file output. Can specify
      multiple targets, e.g., ''--log-requests-target stdout /my/path''. '
  lora-backend:
    kind: value
    type: str
    choices:
    - triton
    - csgmv
    - ascend
    - torch_native
    default: csgmv
    help: Choose the kernel backend for multi-LoRA serving.
  lora-drain-wait-threshold:
    kind: value
    type: float
    default: 0.0
    help: When any LoRA adapter request waits longer than this threshold (in seconds), the scheduler will
      selectively drain one running adapter to make room. This mitigates extreme tail latency under high
      or skewed workloads by preventing a small set of adapters from monopolizing batch slots. Set to
      0 to disable draining (default).
  lora-eviction-policy:
    kind: value
    type: str
    choices:
    - lru
    - fifo
    default: lru
    help: 'LoRA adapter eviction policy when memory pool is full. ''lru'': Least Recently Used (default,
      better cache efficiency). ''fifo'': First-In-First-Out.'
  lora-paths:
    kind: value
    nargs: '*'
    type: str
    help: 'The list of LoRA adapters to load. Each adapter must be specified in one of the following formats:
      <PATH> | <NAME>=<PATH> | JSON with schema {"lora_name":str,"lora_path":str,"pinned":bool}'
  lora-strict-loading:
    kind: bool
    default: false
    help: Enable strict loading for LoRA adapters. When set, mismatched or missing keys in the adapter
      weights will raise an error.
  lora-target-modules:
    kind: value
    nargs: '*'
    type: str
    choices:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - q_a_proj
    - kv_a_proj_with_mqa
    - q_b_proj
    - kv_b_proj
    - wq_b
    - wk
    - weights_proj
    - gate_proj
    - up_proj
    - down_proj
    - qkv_proj
    - gate_up_proj
    - embed_tokens
    - lm_head
    - qkvr
    - wo_ud
    - all
    help: The union set of all target modules where LoRA should be applied. If not specified, it will
      be automatically inferred from the adapters provided in --lora-paths. If 'all' is specified, all
      supported modules will be targeted.
  lora-use-virtual-experts:
    kind: flag
    help: Enable virtual expert computation for MoE models. When set, the model will use virtual expert
      computation.
  mamba-backend:
    kind: value
    type: str
    choices:
    - triton
    - flashinfer
    default: triton
    help: 'Choose the kernel backend for Mamba SSM operations. Default is ''triton''. Options: ''triton''
      (default), ''flashinfer'' (requires FlashInfer with Mamba support).'
  mamba-cache-philox-rounds:
    kind: value
    type: int
    default: 0
    help: Number of Philox rounds to use for stochastic rounding of FP16 Mamba SSM cache writes. Triton
      uses the Triton default when set to 0; FlashInfer uses 10 rounds when set to 0.
  mamba-full-memory-ratio:
    kind: value
    type: float
    default: 0.9
    help: The ratio of mamba state memory to full kv cache memory.
  mamba-max-states-per-path:
    kind: value
    type: int
    default: -1
    help: Maximum number of cached Mamba states retained per root-to-tail path (-1 means unlimited). When
      enabled, after each insert the shallowest eligible interior states beyond the cap are removed while
      their full KV remains. Tail, fork, and locked nodes are preserved. Must be -1 or a positive integer.
  mamba-radix-cache-strategy:
    kind: value
    type: str
    choices:
    - auto
    - no_buffer
    - extra_buffer
    - extra_buffer_lazy
    default: auto
    help: The strategy to use for mamba radix cache.
  mamba-scheduler-strategy:
    kind: value
    type: str
    default: auto
    help: Deprecated alias for --mamba-radix-cache-strategy.
    deprecated: true
  mamba-ssm-dtype:
    kind: value
    type: str
    choices:
    - float32
    - bfloat16
    - float16
    help: The data type of the SSM states in mamba cache. If not set, will be read from model config (mamba_ssm_dtype).
  mamba-track-interval:
    kind: value
    type: int
    default: 256
    help: The interval to track the mamba state during decode.
  max-ep-size:
    kind: value
    type: int
    help: Maximum EP size the server can scale to at runtime. Pre-allocates active-rank state and backend
      buffers to this size. Defaults to the launch-time world size.
  max-loaded-loras:
    kind: value
    type: int
    help: If specified, it limits the maximum number of LoRA adapters loaded in CPU memory at a time.
      The value must be greater than or equal to `--max-loras-per-batch`.
  max-lora-chunk-size:
    kind: value
    type: int
    choices:
    - 16
    - 32
    - 64
    - 128
    default: 16
    help: Maximum chunk size for the ChunkedSGMV LoRA backend. Only used when --lora-backend is 'csgmv'.
      Choosing a larger value might improve performance.
  max-lora-rank:
    kind: value
    type: int
    help: The maximum rank of LoRA adapters. If not specified, it will be automatically inferred from
      the adapters provided in --lora-paths.
  max-loras-per-batch:
    kind: value
    type: int
    default: 8
    help: Maximum number of adapters for a running batch, include base-only request.
  max-mamba-cache-size:
    kind: value
    type: int
    help: The maximum size of the mamba cache.
  max-prefill-tokens:
    kind: value
    type: human_readable_int
    default: 16384
    help: "The maximum number of tokens in a prefill batch. The real bound will be the maximum of this\
      \ value and the model's maximum context length.\n\nSupports standard SI suffixes (k, M, G, T) and\
      \ IEC suffixes\n    (Ki, Mi, Gi, Ti). Suffixes are case-sensitive.\n\n    Decimals are allowed for\
      \ SI suffixes only.\n\n    Examples:\n        '1k' -> 1000      '1M' -> 1000000    '25.6k' -> 25600\n\
      \        '1Ki' -> 1024     '1Mi' -> 1048576\n    "
  max-queued-requests:
    kind: value
    type: int
    help: The maximum number of queued requests. This option is ignored when using disaggregation-mode.
  max-running-requests:
    kind: value
    type: int
    help: The maximum number of running requests.
  max-total-tokens:
    kind: value
    type: human_readable_int
    help: "The maximum number of tokens in the memory pool. If not specified, it will be automatically\
      \ calculated based on the memory usage fraction. This option is typically used for development and\
      \ debugging purposes.\n\nSupports standard SI suffixes (k, M, G, T) and IEC suffixes\n    (Ki, Mi,\
      \ Gi, Ti). Suffixes are case-sensitive.\n\n    Decimals are allowed for SI suffixes only.\n\n  \
      \  Examples:\n        '1k' -> 1000      '1M' -> 1000000    '25.6k' -> 25600\n        '1Ki' -> 1024\
      \     '1Mi' -> 1048576\n    "
  media-url-max-file-size-mb:
    kind: value
    type: int
    default: 64
    help: Maximum size in MiB for one client-supplied remote media download. The limit is enforced while
      streaming; set to 0 to disable it.
  mem-fraction-static:
    kind: value
    type: float
    help: The fraction of the memory used for static allocation (model weights and KV cache memory pool).
      Use a smaller value if you see out-of-memory errors.
  min-free-slots-delay:
    kind: value
    type: int
    help: Hold new prefills until at least N running-request slots have freed up, so they are admitted
      in one batch instead of one at a time. Useful when each admission is disproportionately expensive,
      e.g. speculative decoding with a separate draft prefill pass. An explicit value always wins, capped
      by max-running-requests (1 disables). When unset, DFlash workloads auto-enable the formula; other
      workloads stay disabled. Not supported with pipeline parallelism.
  mlx-enable-sampling:
    kind: flag
    help: 'MLX backend only: sample decode tokens (temperature / top-k / top-p / min-p) instead of greedy
      argmax. Sampling runs inside the lazy MLX graph, so it works with the overlap scheduler; first tokens
      from prefill/extend are sampled too. Greedy requests keep exact argmax behavior. Also enables on
      the MLX path: grammar vocab masks and custom logit processors (these break decode chaining per step;
      custom processors run on pure-decode steps only), logit_bias, output logprobs (sampled token / top-k
      / token_ids; prompt input logprobs are not computed), NaN sanitization (SGLANG_SANITIZE_NAN_LOGITS),
      and per-request sampling_seed under --enable-deterministic-inference (deterministic within MLX only).
      Penalties are not applied.'
  mm-attention-backend:
    kind: value
    type: str
    choices:
    - sdpa
    - fa3
    - fa4
    - triton_attn
    - ascend_attn
    - aiter_attn
    - flashinfer_cudnn
    - amx_attn
    - xpu_attn
    help: Set multimodal attention backend.
  mm-enable-dp-encoder:
    kind: flag
    help: Enabling data parallelism for mm encoder. The dp size will be set to the tp size automatically.
  mm-feature-transport:
    kind: value
    type: str
    choices:
    - cpu
    - cuda_ipc
    - cuda_vmm
    help: Transport multimodal features through CPU memory, a bounded CUDA IPC pool, or a bounded CUDA
      VMM pool. Unset uses cpu except for validated multi-node GB200/GB300 MNNVL models, which use cuda_vmm
      when an IMEX channel is available. Select cuda_ipc explicitly for single-node GPU transport. GPU
      transports reserve SGLANG_MM_FEATURE_CACHE_MB (default 1024 MiB) on the base GPU and fall back to
      CPU transport when the pool is full.
  mm-global-cache-backend:
    kind: value
    type: str
    choices:
    - mooncake
    default: mooncake
    help: Storage backend for the multimodal global embedding cache. Used when --enable-mm-global-cache
      is set.
  mm-io-worker-num:
    kind: value
    type: int
    default: 0
    help: Number of threads for multimodal data loading and decoding. 0 selects the model-specific default.
      SGLANG_IO_WORKERS remains supported as an environment override when this argument is 0.
  mm-preprocess-cache-size-mb:
    kind: value
    type: int
    help: CPU memory budget for content-addressed multimodal preprocessing artifacts. Unset selects a
      model-specific default (256 MiB for Kimi-K3); 0 disables the cache. The budget is divided across
      tokenizer workers and does not reserve GPU memory.
  mm-process-config:
    kind: value
    type: loads
    help: 'Multimodal preprocessing config, a json config contains keys: `image`, `video`, `audio`'
  mm-processor-worker-num:
    kind: value
    type: int
    default: 0
    help: Number of threads for multimodal processor calls. 0 selects the model-specific default. Only
      processors with isolated-worker support can use more than one thread.
  model-checksum:
    kind: value
    nargs: '?'
    type: str
    help: Model file integrity verification. If provided without value, uses model-path as HF repo ID.
      Otherwise, provide checksums JSON file path or HuggingFace repo ID.
  model-config-parser:
    kind: value
    type: str
    default: auto
    help: Which model-config parser to use. "auto" picks "mistral" via the is_mistral_model name heuristic,
      else "hf" (AutoConfig over config.json). Plugins can register additional parsers via @register_model_config_parser.
  model-impl:
    kind: value
    type: str
    default: auto
    help: 'Which implementation of the model to use.


      * "auto" will try to use the SGLang implementation if it exists and fall back to the Transformers
      implementation if no SGLang implementation is available.

      * "sglang" will use the SGLang model implementation.

      * "transformers" will use the Transformers model * "mindspore" will use the MindSpore model implementation.

      '
  model-loader-extra-config:
    kind: value
    type: str
    default: '{}'
    help: Extra config for model loader. This will be passed to the model loader corresponding to the
      chosen load_format. For load_format=presharded, JSON may include presharded_path (target cache root),
      draft_presharded_path (draft cache root), max_file_bytes, hash_num_threads, and verify_on_load.
  model-path:
    kind: value
    aliases:
    - model
    type: str
    help: The path of the model weights. This can be a local folder or a Hugging Face repo ID.
  modelexpress-config:
    kind: value
    type: str
    help: 'JSON config for ModelExpress P2P weight loading. Keys: "url" (optional gRPC host:port override),
      "transport" ("nixl" or "transfer_engine"). Example: ''{"url": "localhost:8001", "transport": "nixl"}'''
  modelopt-checkpoint-restore-path:
    kind: value
    type: str
    help: Path to restore a previously saved ModelOpt quantized checkpoint. If provided, the quantization
      process will be skipped and the model will be loaded from this checkpoint.
  modelopt-checkpoint-save-path:
    kind: value
    type: str
    help: Path to save the ModelOpt quantized checkpoint after quantization. This allows reusing the quantized
      model in future runs.
  modelopt-export-path:
    kind: value
    type: str
    help: Path to export the quantized model in HuggingFace format after ModelOpt quantization. The exported
      model can then be used directly with SGLang for inference. If not provided, the model will not be
      exported.
  modelopt-quant:
    kind: value
    type: str
    help: 'The ModelOpt quantization configuration. Supported values: ''fp8'', ''int4_awq'', ''w4a8_awq'',
      ''nvfp4'', ''nvfp4_awq''. This requires the NVIDIA Model Optimizer library to be installed: pip
      install nvidia-modelopt'
  moe-a2a-backend:
    kind: value
    type: str
    choices:
    - none
    - deepep
    - mooncake
    - nixl
    - mori
    - ascend_fuseep
    - flashinfer
    - megamoe
    - deepep_v2
    - pplx
    - ascend_tp
    default: none
    help: Choose the backend for MoE A2A.
  moe-dense-tp-size:
    kind: value
    type: int
    help: TP size for MoE dense MLP layers. This flag is useful when, with large TP size, there are errors
      caused by weights in MLP layers having dimension smaller than the min dimension GEMM supports.
  moe-dp-size:
    kind: value
    aliases:
    - moe-data-parallel-size
    type: int
    default: 1
    help: The moe data parallelism size.
  moe-runner-backend:
    kind: value
    type: str
    choices:
    - auto
    - deep_gemm
    - triton
    - triton_kernel
    - flashinfer_trtllm
    - experimental_sgl_trtllm
    - flashinfer_trtllm_routed
    - flashinfer_cutlass
    - flashinfer_mxfp4
    - flashinfer_cutedsl
    - cutlass
    - aiter
    - marlin
    - humming
    - experimental_sgl_marlin
    - hpc_ops
    - megamoe
    - intel_xpu
    default: auto
    help: Choose the runner backend for MoE.
  mooncake-ib-device:
    kind: value
    type: str
    help: The InfiniBand devices for Mooncake Backend transfer, accepts multiple comma-separated devices
      (e.g., --mooncake-ib-device mlx5_0,mlx5_1). Default is None, which triggers automatic device detection
      when Mooncake Backend is enabled.
  msprobe-dump-config:
    kind: value
    type: str
    help: The path of the JSON configuration file for msProbe. If specified, enables msProbe dump.
  nccl-port:
    kind: value
    type: int
    help: The port for NCCL distributed environment setup. Defaults to a random port.
  nnodes:
    kind: value
    type: int
    default: 1
    help: The number of nodes.
  node-rank:
    kind: value
    type: int
    default: 0
    help: The node rank.
  nsa-decode-backend:
    kind: value
    type: str
    choices:
    - flashmla_sparse
    - flashmla_sparse_q8
    - flashmla_kv
    - flashmla_auto
    - flashinfer_sparse_mla
    - fa3
    - tilelang
    - aiter
    - trtllm
    default: ==SUPPRESS==
    help: '[Deprecated] Use --dsa-decode-backend instead.'
    deprecated: true
  nsa-prefill-backend:
    kind: value
    type: str
    choices:
    - flashmla_sparse
    - flashmla_sparse_q8
    - flashmla_kv
    - flashmla_auto
    - flashinfer_sparse_mla
    - fa3
    - tilelang
    - aiter
    - trtllm
    default: ==SUPPRESS==
    help: '[Deprecated] Use --dsa-prefill-backend instead.'
    deprecated: true
  nsa-prefill-cp-mode:
    kind: value
    type: str
    choices:
    - in-seq-split
    - round-robin-split
    default: ==SUPPRESS==
    help: '[Deprecated] Use --cp-strategy instead.'
    deprecated: true
  num-continuous-decode-steps:
    kind: value
    type: int
    default: 1
    help: Run multiple continuous decoding steps to reduce scheduling overhead. This can potentially increase
      throughput but may also increase time-to-first-token latency. The default value is 1, meaning only
      run one decoding step at a time.
  num-reserved-decode-tokens:
    kind: value
    type: int
    default: 512
    help: Number of decode tokens that will have memory reserved when adding new request to the running
      batch.
  numa-node:
    kind: value
    nargs: +
    type: int
    help: Sets the numa node for the subprocesses. i-th element corresponds to i-th subprocess. If unset,
      will be automatically detected on NUMA systems.
  offload-group-size:
    kind: value
    type: int
    default: -1
    help: Number of layers per group in offloading.
  offload-mode:
    kind: value
    type: str
    default: cpu
    help: Mode of offloading.
  offload-num-in-group:
    kind: value
    type: int
    default: 1
    help: Number of layers to be offloaded within a group.
  offload-prefetch-step:
    kind: value
    type: int
    default: 1
    help: Steps to prefetch in offloading.
  optimistic-prefill-attempts:
    kind: value
    type: int
    default: 0
    help: Number of optimistic prefill forward passes that skip the bootstrap wait.
  otlp-traces-endpoint:
    kind: value
    type: str
    default: localhost:4317
    help: 'Config opentelemetry collector endpoint if --enable-trace is set. format: <ip>:<port>'
  page-size:
    kind: value
    type: int
    help: The number of tokens in a page.
  pdmux-config-path:
    kind: value
    type: str
    help: The path of the PD-Multiplexing config file.
  piecewise-cuda-graph-compiler:
    kind: value
    type: str
    choices:
    - eager
    - inductor
    help: Deprecated alias for --cuda-graph-tc-compiler.
    deprecated: true
  piecewise-cuda-graph-max-tokens:
    kind: value
    type: int
    help: Deprecated alias for --cuda-graph-max-bs-prefill.
    deprecated: true
  piecewise-cuda-graph-tokens:
    kind: value
    nargs: +
    type: int
    help: Deprecated alias for --cuda-graph-bs-prefill.
    deprecated: true
  port:
    kind: value
    type: int
    default: 30000
    help: The port of the HTTP server.
  pp-async-batch-depth:
    kind: value
    type: int
    default: 0
    help: The async batch depth of pipeline parallelism.
  pp-max-micro-batch-size:
    kind: value
    type: int
    help: The maximum micro batch size in pipeline parallelism.
  pp-size:
    kind: value
    aliases:
    - pipeline-parallel-size
    type: int
    default: 1
    help: The pipeline parallelism size.
  pre-warm-nccl:
    kind: flag
    help: 'Pre-warm NCCL/RCCL communicators during startup to reduce P99 TTFT cold-start latency. Default:
      enabled for AMD/HIP (RCCL), disabled for NVIDIA/CUDA (NCCL).'
  preferred-sampling-params:
    kind: value
    type: loads
    help: json-formatted sampling settings that will be returned in /get_model_info
  prefill-attention-backend:
    kind: value
    type: str
    choices:
    - triton
    - torch_native
    - flex_attention
    - dsa
    - nsa
    - dsv4
    - compressed
    - cutlass_mla
    - fa3
    - fa4
    - flashinfer
    - flashmla
    - trtllm_mla
    - cutedsl_mla
    - tokenspeed_mla
    - trtllm_mha
    - dual_chunk_flash_attn
    - hpc_ops
    - minicpm_flashattn
    - minicpm_flashinfer
    - aiter
    - wave
    - intel_amx
    - ascend
    - intel_xpu
    help: Choose the kernels for prefill attention layers (have priority over --attention-backend).
  prefill-cp-mode:
    kind: value
    type: str
    choices:
    - in-seq-split
    default: in-seq-split
    help: '[Deprecated] Use --cp-strategy {zigzag,interleave} instead. ''in-seq-split'' maps to ''zigzag''.'
    deprecated: true
  prefill-decode-interval:
    kind: value
    type: int
    default: 0
    help: The number of decode rounds to run after a prefill batch before scheduling the next prefill.
      In data-parallel attention mode, the interval is synchronized across all DP ranks. Set to 0 to disable.
  prefill-delayer-forward-passes-buckets:
    kind: value
    nargs: +
    type: float
    help: Custom buckets for prefill delayer forward passes histogram. 0 and max_delay_passes-1 will be
      auto-added.
  prefill-delayer-max-delay-ms:
    kind: value
    type: float
    help: 'Wall-clock cap (ms) on a single queue-trigger delay; once exceeded, prefill is force-released
      to bound worst-case TTFT. Only consulted when --prefill-delayer-queue-min-ratio is set. Typical:
      1000 ~ 5000; defaults to 5000 if unset.'
  prefill-delayer-max-delay-passes:
    kind: value
    type: int
    default: 30
    help: Maximum forward passes to delay prefill.
  prefill-delayer-queue-min-ratio:
    kind: value
    type: float
    help: 'Opt-in to the adaptive queue-based delay trigger (independent of the slot-based one). Delays
      prefill until the waiting queue reaches min(running_req * ratio, prefill_max_requests), falling
      back to the observed max_prefill_bs when no request limit is set. Unset (default) keeps the original
      slot-only behavior. Typical: 0.1 ~ 0.5.'
  prefill-delayer-token-usage-low-watermark:
    kind: value
    type: float
    help: Token usage low watermark for prefill delayer.
  prefill-delayer-wait-seconds-buckets:
    kind: value
    nargs: +
    type: float
    help: Custom buckets for prefill delayer wait seconds histogram. 0 will be auto-added.
  prefill-max-requests:
    kind: value
    type: int
    help: The maximum number of requests in a prefill batch. If not specified, there is no limit.
  prefill-only-disable-kv-cache:
    kind: flag
    help: Skip the physical KV cache allocation for embedding-mode prefill-only workloads. Currently only
      valid with --is-embedding, --chunked-prefill-size=-1, --disable-radix-cache, an FA prefill backend,
      and non-FP4 KV cache so the fa_skip_kv_cache path is active (no layer reads or writes the cache).
      Other prefill-only workloads such as scoring/MIS may benefit from this later once their attention
      paths stop using paged KV. Scheduler admission accounting is unchanged; per-layer K/V tensors are
      sized to (page_size, head_num, head_dim) placeholders so GPU memory is not wasted.
  prefill-round-robin-balance:
    kind: flag
    help: 'Note: --prefill-round-robin-balance is deprecated now.'
    deprecated: true
  priority-scheduling-preemption-threshold:
    kind: value
    type: int
    default: 10
    help: Minimum difference in priorities for an incoming request to have to preempt running request(s).
  prompt-tokens-buckets:
    kind: value
    nargs: +
    type: str
    help: 'The buckets rule of prompt tokens. Supports 3 rule types: ''default'' uses predefined buckets;
      ''tse <middle> <base> <count>'' generates two sides exponential distributed buckets (e.g., ''tse
      1000 2 8'' generates buckets [984.0, 992.0, 996.0, 998.0, 1000.0, 1002.0, 1004.0, 1008.0, 1016.0]).);
      ''custom <value1> <value2> ...'' uses custom bucket values (e.g., ''custom 10 50 100 500'').'
  quantization:
    kind: value
    type: str
    choices:
    - awq
    - fp8
    - mxfp8
    - gptq
    - marlin
    - gptq_marlin
    - awq_marlin
    - bitsandbytes
    - gguf
    - modelopt
    - modelopt_fp8
    - modelopt_fp4
    - nvfp4_online
    - modelopt_mixed
    - petit_nvfp4
    - w8a8_int8
    - w8a8_fp8
    - moe_wna16
    - w4afp8
    - mxfp4
    - auto-round
    - auto-round-int8
    - compressed-tensors
    - modelslim
    - mxfp_w4a8
    - quark
    - quark_int4fp8_moe
    - quark_mxfp4
    - mlx_q4
    - mlx_q8
    - unquant
    - humming
    help: The quantization method.
  quantization-param-path:
    kind: value
    type: nullable_str
    help: 'Path to the JSON file containing the KV cache scaling factors. This should generally be supplied,
      when KV cache dtype is FP8. Otherwise, KV cache scaling factors default to 1.0, which may cause
      accuracy issues. '
  quantize-and-serve:
    kind: flag
    help: Quantize the model with ModelOpt and immediately serve it without exporting. This is useful
      for development and prototyping. For production, it's recommended to use separate quantization and
      deployment steps.
  radix-cache-backend:
    kind: value
    type: str
    help: Name of a radix-cache backend previously registered via register_radix_cache_backend. Omit this
      flag to use the built-in default cache selection chain.
  radix-eviction-policy:
    kind: value
    type: str
    choices:
    - lru
    - lfu
    - slru
    - priority
    default: lru
    help: The eviction policy of radix trees. 'lru' stands for Least Recently Used, 'lfu' stands for Least
      Frequently Used, 'slru' stands for Segmented Least Recently Used, and 'priority' evicts lower-priority
      requests first.
  random-seed:
    kind: value
    type: int
    help: The random seed.
  reasoning-parser:
    kind: value
    type: str
    choices:
    - auto
    - apertus2509
    - deepseek-r1
    - deepseek-v3
    - deepseek-v4
    - dots
    - glm45
    - ling3
    - hunyuan
    - gpt-oss
    - kimi
    - kimi_k2
    - kimi_k3
    - mimo
    - muse
    - poolside_v1
    - qwen3
    - qwen3-thinking
    - minimax
    - minimax-append-think
    - minimax-m3
    - step3
    - step3p5
    - mistral
    - nemotron_3
    - interns1
    - gemma4
    - inkling
    - cohere_command4
    help: 'Specify the parser for reasoning models. Use ''auto'' to detect from chat template. Options
      include: [''apertus2509'', ''deepseek-r1'', ''deepseek-v3'', ''deepseek-v4'', ''dots'', ''glm45'',
      ''ling3'', ''hunyuan'', ''gpt-oss'', ''kimi'', ''kimi_k2'', ''kimi_k3'', ''mimo'', ''muse'', ''poolside_v1'',
      ''qwen3'', ''qwen3-thinking'', ''minimax'', ''minimax-append-think'', ''minimax-m3'', ''step3'',
      ''step3p5'', ''mistral'', ''nemotron_3'', ''interns1'', ''gemma4'', ''inkling'', ''cohere_command4''].'
  remote-instance-weight-loader-backend:
    kind: value
    type: str
    choices:
    - transfer_engine
    - nccl
    - modelexpress
    default: nccl
    help: The backend for loading weights from remote instance. Can be 'transfer_engine', 'nccl', or 'modelexpress'.
      Default is 'nccl'.
  remote-instance-weight-loader-seed-instance-ip:
    kind: value
    type: str
    help: The ip of the seed instance for loading weights from remote instance.
  remote-instance-weight-loader-seed-instance-service-port:
    kind: value
    type: int
    help: The service port of the seed instance for loading weights from remote instance.
  remote-instance-weight-loader-send-weights-group-ports:
    kind: value
    type: json_list_type
    help: The communication group ports for loading weights from remote instance.
  remote-instance-weight-loader-start-seed-via-transfer-engine:
    kind: flag
    help: Start seed server via transfer engine backend for remote instance weight loader.
  retraction-policy:
    kind: value
    type: str
    choices:
    - length
    - priority
    default: length
    help: The decode retraction policy to use when the KV cache is full. 'length' preserves the existing
      behavior and retracts short-output, long-input requests first. 'priority' retracts lower-priority
      requests first, using the same priority direction as priority scheduling.
  return-hidden-states-mode:
    kind: value
    type: str
    choices:
    - last
    - full
    help: Set the maximum hidden-state return mode supported by the server. `last` allows requests with
      return_hidden_states=False or `last`; `full` also allows return_hidden_states=True.
  revision:
    kind: value
    type: str
    help: The specific model version to use. It can be a branch name, a tag name, or a commit id. If unspecified,
      will use the default version.
  rl-on-policy-target:
    kind: value
    type: str
    choices:
    - fsdp
    help: The training system that SGLang needs to match for true on-policy.
  rl-quant-profile:
    kind: value
    type: str
    help: Path to the FlashRL quantization profile. Required when using --load-format flash_rl.
  sampling-backend:
    kind: value
    type: str
    choices:
    - pytorch
    - ascend
    - flashinfer
    help: Choose the kernels for sampling layers.
  sampling-defaults:
    kind: value
    type: str
    choices:
    - openai
    - model
    default: model
    help: Where to get default sampling parameters. 'openai' uses SGLang/OpenAI defaults (temperature=1.0,
      top_p=1.0, etc.). 'model' uses the model's generation_config.json to get the recommended sampling
      parameters if available. Default is 'model'.
  schedule-conservativeness:
    kind: value
    type: float
    default: 1.0
    help: How conservative the schedule policy is. A larger value means more conservative scheduling.
      Use a larger value if you see requests being retracted frequently.
  schedule-low-priority-values-first:
    kind: flag
    help: If specified with --enable-priority-scheduling, the scheduler will schedule requests with lower
      priority integer values first.
  schedule-policy:
    kind: value
    type: str
    choices:
    - lpm
    - random
    - fcfs
    - dfs-weight
    - lof
    - priority
    - routing-key
    default: fcfs
    help: The scheduling policy of the requests.
  scheduler-recv-interval:
    kind: value
    type: int
    default: 1
    help: The interval to poll requests in scheduler. Can be set to >1 to reduce the overhead of this.
  served-model-name:
    kind: value
    type: str
    help: Override the model name returned by the v1/models endpoint in OpenAI API server.
  show-time-cost:
    kind: flag
    help: Show time cost of custom marks.
  sidecar:
    kind: value
    type: str
    help: Start a locally managed sidecar against the native gRPC server. The selected module must expose
      main(argv) and read the resolved native gRPC endpoint from SGLANG_GRPC_ENDPOINT. Requires --grpc-port
      or SGLANG_GRPC_PORT.
  sidecar-args:
    kind: value
    type: json_list_type
    help: JSON array passed to the selected sidecar module's main(argv) function. --sidecar-shutdown-timeout
      SECONDS is consumed by SGLang.
  skip-server-warmup:
    kind: flag
    help: If set, skip warmup.
  skip-tokenizer-init:
    kind: flag
    help: If set, skip init tokenizer and pass input_ids in generate request.
  sleep-on-idle:
    kind: flag
    help: Reduce CPU usage when sglang is idle.
  sm-group-num:
    kind: value
    type: int
    default: 8
    help: Number of sm partition groups.
  smg-grpc-mode:
    kind: flag
    help: Use the legacy SMG gRPC server (smg-grpc-servicer) instead of the HTTP server. Replaces the
      deprecated --grpc-mode.
  smg-http-sidecar-port:
    kind: value
    aliases:
    - grpc-http-sidecar-port
    type: int
    help: Port for the HTTP sidecar server in legacy SMG gRPC mode (--smg-grpc-mode). Serves Prometheus
      metrics and profiling endpoints. Defaults to --port + 1. Not used in HTTP mode.
  soft-watchdog-timeout:
    kind: value
    type: float
    help: Set soft watchdog timeout in seconds. If a forward batch takes longer than this, the server
      will dump information for debugging.
  spec-trace-dir:
    kind: value
    type: str
    help: Directory to write decoupled speculative decoding trace files.
  speculative-accept-threshold-acc:
    kind: value
    type: float
    default: 1.0
    help: The accept probability of a draft token is raised from its target probability p to min(1, p
      / threshold_acc).
  speculative-accept-threshold-single:
    kind: value
    type: float
    default: 1.0
    help: Accept a draft token if its probability in the target model is greater than this threshold.
  speculative-adaptive:
    kind: flag
    help: Enable adaptive speculative decoding that dynamically adjusts num_steps based on acceptance
      rate.
  speculative-adaptive-config:
    kind: value
    type: str
    help: Path to a JSON config file for adaptive speculative decoding tuning knobs.
  speculative-algorithm:
    kind: value
    type: str
    help: 'Speculative algorithm. Builtins: EAGLE, EAGLE3, NEXTN, STANDALONE, NGRAM, DFLASH, DSPARK. Or
      any name registered via `SpeculativeAlgorithm.register`.'
  speculative-attention-mode:
    kind: value
    type: str
    choices:
    - prefill
    - decode
    default: prefill
    help: Attention backend for speculative decoding operations (both target verify and draft extend).
      Can be one of 'prefill' (default) or 'decode'.
  speculative-dflash-block-size:
    kind: value
    type: int
    help: DFLASH only. Block size (verify window length). Alias of --speculative-num-draft-tokens for
      DFLASH.
  speculative-dflash-draft-window-size:
    kind: value
    type: int
    help: ==SUPPRESS==
    deprecated: true
  speculative-draft-attention-backend:
    kind: value
    type: str
    help: Attention backend for speculative decoding drafting.
  speculative-draft-kv-cache-dtype:
    kind: value
    type: str
    choices:
    - auto
    - fp8_e5m2
    - fp8_e4m3
    - bf16
    - bfloat16
    help: 'KV cache dtype for the speculative draft model only. The draft pool is allocated with one slot
      per target token (draft and target share a slot index space), so for a small draft it can still
      rival the target pool: a 5-layer DFLASH draft costs 10240 bytes/token in bf16. Setting fp8_e4m3
      halves the draft pool; the saving shows up as free device memory, so raise --mem-fraction-static
      to convert it into KV capacity. Default follows --kv-cache-dtype.'
  speculative-draft-load-format:
    kind: value
    type: str
    choices:
    - auto
    - pt
    - safetensors
    - npcache
    - dummy
    - sharded_state
    - presharded
    - gguf
    - expert_pack
    - bitsandbytes
    - mistral
    - layered
    - flash_rl
    - remote
    - remote_instance
    - fastsafetensors
    - private
    - runai_streamer
    help: The format of the draft model weights to load. If not specified, will use the same format as
      --load-format. Use 'dummy' to initialize draft model weights with random values for profiling.
  speculative-draft-model-path:
    kind: value
    aliases:
    - speculative-draft-model
    type: str
    help: The path of the draft model weights. This can be a local folder or a Hugging Face repo ID.
  speculative-draft-model-quantization:
    kind: value
    type: str
    choices:
    - awq
    - fp8
    - mxfp8
    - gptq
    - marlin
    - gptq_marlin
    - awq_marlin
    - bitsandbytes
    - gguf
    - modelopt
    - modelopt_fp8
    - modelopt_fp4
    - nvfp4_online
    - modelopt_mixed
    - petit_nvfp4
    - w8a8_int8
    - w8a8_fp8
    - moe_wna16
    - w4afp8
    - mxfp4
    - auto-round
    - auto-round-int8
    - compressed-tensors
    - modelslim
    - mxfp_w4a8
    - quark
    - quark_int4fp8_moe
    - quark_mxfp4
    - mlx_q4
    - mlx_q8
    - unquant
    - humming
    help: The quantization method for speculative model.
  speculative-draft-model-revision:
    kind: value
    type: str
    help: The specific draft model version to use. It can be a branch name, a tag name, or a commit id.
      If unspecified, will use the default version.
  speculative-draft-window-size:
    kind: value
    type: int
    help: Sliding window size for the draft model. Honored by Llama EAGLE-3 (`LlamaForCausalLMEagle3`)
      and DFLASH only; other EAGLE-3 backends (e.g. MLA-based drafters) silently ignore it. For Llama
      EAGLE-3, the drafter only attends to the most recent N keys (verifier hidden states + its own outputs);
      the verifier is unaffected. For DFLASH, the draft worker keeps a recent target-token window in its
      local KV cache (paged backends may retain up to one extra page on the left for alignment). Default
      is full attention/context.
  speculative-dsa-topk-backend:
    kind: value
    type: str
    choices:
    - sgl-kernel
    - torch
    - flashinfer
    default: sgl-kernel
    help: 'DSA indexer top-k backend for speculative draft workers. Options: ''sgl-kernel'', ''torch'',
      ''flashinfer''. The ''torch'' backend currently requires SGLANG_DSA_FUSE_TOPK=false.'
  speculative-dspark-align-verify-tokens-to-graph-tier:
    kind: flag
    help: 'DSPARK compact ragged-verify only. Fill the per-request verify lengths so the total verify-token
      count reaches the cuda-graph tier the forward is already padded to: round the dp-max scheduled total
      up to the captured token bucket and let the top-k allocator admit that many real draft tokens (confidence-ordered).
      This recovers the padding the forward pays for anyway -- both the cuda-graph bucket round-up and
      the dp cross-rank max -- turning it into extra real verification at the same step time. Off by default;
      when off the schedule is byte-for-byte unchanged.'
  speculative-dspark-block-size:
    kind: value
    type: int
    help: DSPARK only. Draft block size gamma (number of proposed draft tokens). The verify window is
      gamma + 1, so this sets --speculative-num-draft-tokens = gamma + 1. Omit to auto-infer gamma from
      the draft checkpoint block_size.
  speculative-dspark-confidence-sts-path:
    kind: value
    type: str
    help: DSPARK only. Optional path to a per-position STS (sequential temperature scaling) calibration
      JSON, fit offline with sglang.benchmark.dspark_sts_fit. Calibrates the confidence-head survival
      probabilities the ragged-verify scheduler consumes. Omit to use identity (no calibration); losslessness
      is unaffected either way.
  speculative-dspark-sps-table-path:
    kind: value
    type: str
    help: 'DSPARK only. Path to a pre-profiled SPS cost table (JSON) built offline with sglang.benchmark.dspark_sps_profiler,
      consumed by the ragged-verify scheduler (cap-accept / compact). Omit for an uninitialized flat constant-SPS
      table: the budget degenerates to verify-all (zero throughput gain by itself).'
  speculative-eagle-topk:
    kind: value
    type: int
    help: The number of tokens sampled from the draft model in eagle2 each step.
  speculative-moe-a2a-backend:
    kind: value
    type: str
    choices:
    - none
    - deepep
    - mooncake
    - nixl
    - mori
    - ascend_fuseep
    - flashinfer
    - megamoe
    - deepep_v2
    - pplx
    - ascend_tp
    help: Choose the backend for MoE A2A in speculative decoding
  speculative-moe-runner-backend:
    kind: value
    type: str
    choices:
    - auto
    - deep_gemm
    - triton
    - triton_kernel
    - flashinfer_trtllm
    - experimental_sgl_trtllm
    - flashinfer_trtllm_routed
    - flashinfer_cutlass
    - flashinfer_mxfp4
    - flashinfer_cutedsl
    - cutlass
    - aiter
    - marlin
    - humming
    - experimental_sgl_marlin
    - hpc_ops
    - megamoe
    - intel_xpu
    help: Choose the runner backend for MoE in speculative decoding.
  speculative-ngram-capacity:
    kind: value
    type: int
    default: 10000000
    help: The cache capacity for ngram speculative decoding.
  speculative-ngram-external-corpus-max-tokens:
    kind: value
    type: int
    default: 10000000
    help: Fail startup if the tokenized external ngram corpus exceeds this many tokens. Tune this based
      on your CPU memory budget.
  speculative-ngram-external-corpus-path:
    kind: value
    type: str
    help: Path to an external JSONL corpus to pre-load into SAM at startup. Additional corpora can be
      added at runtime via POST /add_external_corpus.
  speculative-ngram-external-sam-budget:
    kind: value
    type: int
    default: 0
    help: Number of draft nodes reserved for the external SAM subtree in ngram speculative decoding.
  speculative-ngram-match-type:
    kind: value
    type: str
    choices:
    - BFS
    - PROB
    default: BFS
    help: The match type for cache tree.
  speculative-ngram-max-bfs-breadth:
    kind: value
    type: int
    default: 10
    help: The maximum breadth for BFS (Breadth-First Search) in ngram speculative decoding.
  speculative-ngram-max-trie-depth:
    kind: value
    type: int
    default: 18
    help: The max trie depth for ngram speculative decoding.
  speculative-ngram-min-bfs-breadth:
    kind: value
    type: int
    default: 1
    help: The minimum breadth for BFS (Breadth-First Search) in ngram speculative decoding.
  speculative-num-draft-tokens:
    kind: value
    type: int
    help: The number of tokens sampled from the draft model in Speculative Decoding.
  speculative-num-steps:
    kind: value
    type: int
    help: The number of steps sampled from draft model in Speculative Decoding.
  speculative-skip-dp-mlp-sync:
    kind: flag
    help: Skip the extra MLP sync that the scheduler performs before merging a new batch when speculative
      decoding + DP attention are both enabled.
  speculative-token-map:
    kind: value
    type: str
    help: The path of the draft model's small vocab table.
  speculative-use-rejection-sampling:
    kind: flag
    help: Use rejection sampling for speculative decoding (requires topk=1).
  ssl-ca-certs:
    kind: value
    type: str
    help: The CA certificates file.
  ssl-certfile:
    kind: value
    type: str
    help: The file path to the SSL certificate file.
  ssl-keyfile:
    kind: value
    type: str
    help: The file path to the SSL key file.
  ssl-keyfile-password:
    kind: value
    type: str
    help: The password to decrypt the SSL keyfile.
  startup-weight-load-mode:
    kind: value
    type: str
    choices:
    - serial
    - overlap
    default: serial
    help: Control startup weight loading relative to CUDA graph capture. 'serial' preserves the existing
      startup order; 'overlap' stages checkpoint files while CUDA graphs are captured and commits the
      real weights afterward.
  stream-interval:
    kind: value
    type: int
    default: 1
    help: The interval (or buffer size) for streaming in terms of the token length. A smaller value makes
      streaming smoother, while a larger value makes the throughput higher
  stream-output:
    kind: flag
    help: '[Deprecated] Use --incremental-streaming-output instead.'
    deprecated: true
  stream-response-default-include-usage:
    kind: flag
    help: Include usage in every streaming response (even when stream_options is not specified).
  strip-thinking-cache:
    kind: flag
    help: 'Skip caching reasoning-model output (thinking + answer) in the radix tree on finish; keep only
      the prompt prefix. Opt-in: changes cache contents.'
  swa-full-tokens-ratio:
    kind: value
    type: float
    default: 0.8
    help: The ratio of SWA layer KV tokens / full layer KV tokens, regardless of the number of swa:full
      layers. It should be between 0 and 1. E.g. 0.5 means if each swa layer has 50 tokens, then each
      full layer has 100 tokens.
  tbo-token-distribution-threshold:
    kind: value
    type: float
    default: 0.48
    help: The threshold of token distribution between two batches in micro-batch-overlap, determines whether
      to two-batch-overlap or two-chunk-overlap. Set to 0 denote disable two-chunk-overlap.
  tokenizer-backend:
    kind: value
    type: str
    choices:
    - huggingface
    - fastokens
    default: huggingface
    help: Tokenizer backend. 'huggingface' uses the default HuggingFace tokenizers library, and 'fastokens'
      uses the fastokens library for faster tokenization. Requires the fastokens package to be installed.
  tokenizer-metrics-allowed-custom-labels:
    kind: value
    nargs: +
    type: str
    help: 'The custom labels allowed for tokenizer metrics. The labels are specified via a dict in ''--tokenizer-metrics-custom-labels-header''
      field in HTTP requests, e.g., {''label1'': ''value1'', ''label2'': ''value2''} is allowed if ''--tokenizer-metrics-allowed-custom-labels
      label1 label2'' is set.'
  tokenizer-metrics-custom-labels-header:
    kind: value
    type: str
    default: x-custom-labels
    help: Specify the HTTP header for passing custom labels for tokenizer metrics.
  tokenizer-mode:
    kind: value
    type: str
    choices:
    - auto
    - slow
    default: auto
    help: Tokenizer mode. 'auto' will use the fast tokenizer if available, and 'slow' will always use
      the slow tokenizer.
  tokenizer-path:
    kind: value
    type: str
    help: The path of the tokenizer.
  tokenizer-worker-num:
    kind: value
    type: int
    default: 1
    help: The worker num of the tokenizer manager.
  tool-call-parser:
    kind: value
    type: str
    choices:
    - auto
    - apertus2509
    - cohere_command4
    - deepseekv3
    - deepseekv31
    - deepseekv32
    - deepseekv4
    - dots
    - glm
    - glm45
    - glm47
    - gpt-oss
    - kimi_k2
    - kimi_k3
    - lfm2
    - ling3
    - llama3
    - mimo
    - minicpm5
    - mistral
    - muse
    - poolside_v1
    - pythonic
    - qwen
    - qwen25
    - qwen3_coder
    - spark25
    - step3
    - step3p5
    - minimax-m2
    - minimax-m3
    - trinity
    - interns1
    - hermes
    - hunyuan
    - gigachat3
    - gemma4
    - inkling
    help: 'Specify the parser for handling tool-call interactions. Use ''auto'' to detect from chat template.
      Options include: [''apertus2509'', ''cohere_command4'', ''deepseekv3'', ''deepseekv31'', ''deepseekv32'',
      ''deepseekv4'', ''dots'', ''glm'', ''glm45'', ''glm47'', ''gpt-oss'', ''kimi_k2'', ''kimi_k3'',
      ''lfm2'', ''ling3'', ''llama3'', ''mimo'', ''minicpm5'', ''mistral'', ''muse'', ''poolside_v1'',
      ''pythonic'', ''qwen'', ''qwen25'', ''qwen3_coder'', ''spark25'', ''step3'', ''step3p5'', ''minimax-m2'',
      ''minimax-m3'', ''trinity'', ''interns1'', ''hermes'', ''hunyuan'', ''gigachat3'', ''gemma4'', ''inkling''].'
  tool-server:
    kind: value
    type: str
    help: Either 'demo' or a comma-separated list of tool server urls to use for the model. If not specified,
      no tool server will be used.
  torch-compile-max-bs:
    kind: value
    type: int
    default: 32
    help: Set the maximum batch size when using torch compile.
  tp-size:
    kind: value
    aliases:
    - tensor-parallel-size
    type: int
    default: 1
    help: The tensor parallelism size.
  trace-modules:
    kind: value
    type: str
    default: request
    help: 'Select the components to trace. Available options are ''request'' and ''mooncake''. Format:
      <module1 name>,<module2 name>,...'
  triton-attention-num-kv-splits:
    kind: value
    type: int
    default: 8
    help: The number of KV splits in flash decoding Triton kernel. Larger value is better in longer context
      scenarios. The default value is 8.
  triton-attention-reduce-in-fp32:
    kind: flag
    help: Cast the intermediate attention results to fp32 to avoid possible crashes related to fp16.This
      only affects Triton attention kernels.
  triton-attention-split-tile-size:
    kind: value
    type: int
    help: The size of split KV tile in flash decoding Triton kernel. Used for deterministic inference.
  trust-mm-content-hashes:
    kind: flag
    help: Trust caller-provided multimodal SHA-256 content hashes. This can skip reading media on a hot
      metadata-cache hit; only enable it when the caller guarantees that hashes identify immutable media
      bytes.
  trust-remote-code:
    kind: flag
    help: Whether or not to allow for custom models defined on the Hub in their own modeling files.
  use-ray:
    kind: flag
    help: Use Ray actors for scheduler process management.
  uvicorn-access-log-exclude-prefixes:
    kind: value
    nargs: '*'
    type: str
    default: []
    help: 'Exclude uvicorn access logs whose request path starts with any of these prefixes. Defaults
      to empty (disabled). Example: --uvicorn-access-log-exclude-prefixes /metrics /health'
  warmups:
    kind: value
    type: str
    help: Specify custom warmup functions (csv) to run before server starts eg. --warmups=warmup_name1,warmup_name2
      will run the functions `warmup_name1` and `warmup_name2` specified in warmup.py before the server
      starts listening for requests
  watchdog-timeout:
    kind: value
    type: float
    default: 300
    help: Set watchdog timeout in seconds. If a forward batch takes longer than this, the server will
      crash to prevent hanging.
  weight-cache-mode:
    kind: value
    type: str
    choices:
    - 'off'
    - daemon
    - client
    default: 'off'
    help: 'Weight cache mode. ''off'': normal disk loading. ''daemon'': launch weight cache daemon (holds
      weights in GPU memory). Engine-spawned daemons are co-terminal with the engine and do NOT persist
      across restarts, so this alone does not speed up restart (the first start is slower). For fast recovery,
      run the standalone daemon (python -m sglang.srt.weight_cache.daemon) and connect with ''client''.
      ''client'': connect to existing daemon and load via IPC.'
  weight-cache-socket:
    kind: value
    type: str
    help: Unix socket path for weight cache daemon (client mode).If not set, derives the path from SGLANG_WEIGHT_CACHE_SOCKET_TEMPLATE
      using the caller's physical GPU UUID.
  weight-cache-timeout:
    kind: value
    type: int
    default: 1800
    help: 'Timeout in seconds for weight cache daemon readiness (default: 1800).'
  weight-loader-disable-mmap:
    kind: flag
    help: Disable mmap while loading weight using safetensors.
  weight-loader-drop-cache-after-load:
    kind: flag
    help: Call posix_fadvise(DONTNEED) on each safetensors shard after loading it.
  weight-loader-prefetch-checkpoints:
    kind: flag
    help: Prefetch checkpoint files into OS page cache before loading. Each rank prefetches a fraction
      of the shards, reducing total network I/O on shared filesystems (NFS/Lustre) from N*checkpoint to
      1*checkpoint. Recommended for models on network storage. When enabled, multi-threaded safetensors
      loading is disabled by default to avoid I/O oversubscription with the prefetch threads; set enable_multithread_load=true
      in --model-loader-extra-config to keep multi-threaded loading (e.g. on local NVMe where prefetch
      is a no-op).
  weight-loader-prefetch-num-threads:
    kind: value
    type: int
    default: 4
    help: 'Number of threads per rank for checkpoint prefetching (default: 4).'
  weight-version:
    kind: value
    type: str
    default: default
    help: Version identifier for the model weights. Defaults to 'default' if not specified.
