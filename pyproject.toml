[project]
name = "modal-inference-server"
version = "0.1.0"
description = "Serve SGLang models on Modal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "CHRV", email = "c.h.onguene@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "modal>=1.5.5",
    "pyyaml>=6.0",
]

[project.scripts]
modal-sglang = "modal_inference_server.cli:main"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"
